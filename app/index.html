<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>/* 판: 주소 뒤 ?theme=light|dark > 저장한 값(localStorage pickle_theme, 왼쪽 아래 버튼이 저장) > 밝은 판(기본). 그리기 전에 정해서 깜빡임을 막는다. 저장소가 막혀도 화면은 동작한다 */(function(){var t="";try{var q=new URLSearchParams(location.search).get("theme");if(q==="dark"||q==="light")t=q;}catch(e){}if(!t){try{var v=localStorage.getItem("pickle_theme");if(v==="dark"||v==="light")t=v;}catch(e){}}document.documentElement.setAttribute("data-theme",t||"light");})();</script>
<title>PICKLE — 내 취향의 뮤지컬 찾기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* hidden 속성은 항상 숨긴다: .undobar 처럼 display 를 정한 클래스가 hidden 의 기본 display:none 을 덮어쓰는 걸 한 번에 막는다(뒤로 버튼은 아래 .top button[hidden] 이 더 구체적이라 자리를 지킨다) */
[hidden]{display:none!important}
/* 폰 한 대(390px) 안에서 도는 가안. 핵심 화면은 캐스팅 캘린더: 날짜마다 누가 나오는지 보이고, 배우를 고르면 그 배우 나오는 날만 켜진다. */
/* 디자인 토큰: Stitch 'Calm Editorial Precision'(DESIGN.md) — 흰 카드 · #F8F9FA 바탕 · 1px #E6E6E6 선 · 와인 #B23A48 하나 · 10px 모서리 · 그림자 없음 · Pretendard. 라이트 전용. */
:root{
  --bg:#F8F9FA; --fg:#141414; --muted:#5E5E5E; --faint:#8E8E93; --surface:#FFFFFF; --line:#E6E6E6; --soft:#F3F4F6; --divider:#F3F4F6; --outside:#F3F4F6; --dash:#D1D5DB;
  --ok:#2E7D5B; --warn:#9A6512; --accent:#B23A48; --accent-hover:#982F3B; --accent-soft:#FDF2F4; --accent-tint:#FBE8EA;
  --display:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; --font:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r1:#B23A48; --r2:#B23A48; --r3:#B23A48; --r4:#B23A48; --r5:#B23A48; --r6:#B23A48;  /* 배역색을 따로 쓰지 않고 강조색 하나로 */
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;letter-spacing:-0.005em;-webkit-font-smoothing:antialiased}
/* 900px 미만: 앱 배치(하단 탭, 고정 버튼). 900px 이상: 웹 배치(상단 메뉴, 여러 칸). */
.shell{min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;min-height:56px;padding:0 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.top .brand{text-align:center;font-weight:800;font-size:18px;letter-spacing:-0.01em;color:var(--hl)}
.top .brand svg{vertical-align:-3px;margin-right:6px}
.top button{border:0;background:transparent;color:var(--fg);font-size:24px;line-height:1;padding:4px;border-radius:8px;cursor:pointer}
.top button[hidden]{visibility:hidden;display:block!important}
.topnav{display:none}
.steps{display:flex;gap:4px;flex-wrap:wrap;align-items:center;justify-content:center;padding:12px 16px 0;font-size:12px;color:var(--faint)}
.steps span{display:inline-flex;gap:4px;align-items:center;padding:4px 10px;border-radius:999px}
.steps span i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.04em}
.steps span.on{background:var(--hl-soft);color:var(--hl);font-weight:700}
.steps .sep{color:var(--dash);font-weight:400}
@media (max-width:599px){.steps{gap:0;flex-wrap:nowrap}.steps span{padding:4px 6px;white-space:nowrap}.steps span:not(.on) i{display:none}.steps .sep{font-size:10px}}
main{flex:1;width:100%;max-width:640px;margin:0 auto;padding:20px 20px 110px;display:grid;gap:16px;align-content:start}
.inline-cta{display:none}
h1,h2,h3{margin:0;font-weight:700;font-family:var(--display)}
h1{font-size:26px;line-height:1.3;letter-spacing:-0.02em}h2{font-size:20px;line-height:1.35;letter-spacing:-0.015em}h3{font-size:16px;line-height:1.4;font-weight:600;letter-spacing:-0.01em}
.eyebrow{margin:0 0 4px;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--hl)}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}.tiny.muted{color:var(--faint)}
a{color:inherit}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:10px}
.card.accent{border-color:var(--hl)}
.card.picked{border-top:2px solid var(--hl)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips:has(> .pair){display:grid;gap:6px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pair .chip{justify-content:center;text-align:center;min-width:0}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:10px;min-height:36px;padding:7px 14px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;line-height:1.3;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.chip:hover{border-color:var(--dash)}
.chip.on{background:var(--hl-soft);border-color:var(--hl);color:var(--hl);font-weight:600}
.chip.role.on{background:var(--hl-soft);border-color:var(--hl);color:var(--hl)}
.chip:disabled{opacity:.45;cursor:default}
.chip small{display:block;font-size:11px;opacity:.8}
.chip:has(small){flex-direction:column;align-items:flex-start;gap:0}
.chip .n{font-size:11px;opacity:.65;margin-left:5px}
.chip.x{min-height:32px;padding:5px 12px;font-size:13px}
.card>.chip.x{justify-self:end;align-self:flex-end;color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:500;padding:3px 8px;border-radius:6px;background:var(--soft);color:var(--muted)}
.tag.hit{background:var(--hl-tint);color:var(--hl);font-weight:600}
.tag.rc{background:var(--hl-tint);color:var(--hl)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;border:1px solid var(--hl);border-radius:10px;padding:10px 16px;font-size:15px;font-weight:600;background:var(--hl);color:#fff;cursor:pointer;font-family:inherit;text-align:center;text-decoration:none;letter-spacing:-0.005em}
.btn:hover{background:var(--hl);border-color:var(--hl)}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--bg)}
.btn.sm{min-height:40px;font-size:14px;padding:8px 12px}
.btn:disabled{background:var(--soft);border-color:var(--line);color:var(--faint);cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
input,select{font:inherit;min-height:48px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);width:100%}
input:focus,select:focus{outline:none;border-color:var(--hl)}
input::placeholder{color:var(--faint)}

/* 작품 그리드 */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.work{position:relative;border-radius:10px;overflow:hidden;background:var(--surface);border:1px solid var(--line);cursor:pointer;display:grid;align-content:start}
.work:hover{border-color:var(--dash)}
.work.off{opacity:.55;cursor:default}
.poster{aspect-ratio:3/4;width:100%;object-fit:cover;display:block;background:var(--soft)}
.poster.type{display:grid;place-items:center;padding:14px;text-align:center;font-size:18px;font-weight:700;color:var(--muted);background:var(--line)}
.work{grid-template-rows:auto 1fr}
.work .info{padding:12px 12px 14px;display:flex;flex-direction:column;gap:4px}
.work .info b{font-size:16px;letter-spacing:-0.01em}
.work .info .tiny:last-of-type{margin-bottom:8px}
.work .go{margin-top:auto;display:flex;align-items:center;justify-content:center;min-height:36px;border:1px solid var(--line);border-radius:10px;font-size:13px;font-weight:600;color:var(--fg)}
.work:hover .go{border-color:var(--hl);color:var(--hl)}
.work .state{position:absolute;top:8px;left:8px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;background:#fff;color:var(--hl);border:1px solid var(--line)}

/* 작품 머리 */
.head{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center}
.head .poster{width:64px;border-radius:8px;aspect-ratio:3/4}
.head .poster.type{font-size:13px;padding:6px}
.head.sm{grid-template-columns:44px minmax(0,1fr);gap:10px}
.head.sm .poster{width:44px}
.head.sm .poster.type{font-size:11px;padding:4px}
.head h2{overflow-wrap:anywhere}

/* 캘린더 */
.cal{display:grid;gap:6px}
.cal .mh{font-weight:700;margin-top:4px}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow span{text-align:center;font-size:11px;color:var(--muted)}
.dow span:nth-child(6){color:var(--r5)}.dow span:nth-child(7){color:var(--r4)}
.day{min-height:54px;border-radius:8px;padding:3px 2px 4px;background:var(--surface);border:1px solid var(--line);display:grid;align-content:start;gap:1px;cursor:default;position:relative}
.day.empty{background:transparent;border-color:transparent}
.day.none{background:transparent}
.day .n{font-size:11px;color:var(--muted);line-height:1.2;padding-left:2px}
.day.has{cursor:pointer}
.day.hit{border-color:var(--hl);background:var(--hl-soft)}
.day.pin{position:relative;border-color:var(--hl);box-shadow:inset 0 0 0 1px var(--hl);opacity:1}
.day.pin::after{content:"✓";position:absolute;top:2px;right:4px;font-size:10px;font-weight:700;color:var(--hl)}
.day.peek{outline:2px solid var(--hl);outline-offset:-1px}
/* 화면 하나 = 질문 하나: 한 컬럼 */
.one{display:grid;gap:14px;width:100%;max-width:760px;margin:0 auto}
.peekbar{position:sticky;top:60px;z-index:3;padding:12px 14px;gap:6px}
.peekbar .row{gap:6px}
.day.hit .n{color:var(--fg);font-weight:700}
.day.dim{opacity:.4}
.day .s{font-size:10.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px;border-radius:3px}
.day .s.m{color:var(--muted)}
.day .s.k{background:var(--hl);color:#fff}
.day .star{position:absolute;top:2px;right:3px;font-size:9px;color:var(--warn)}
.legend{font-size:12px;color:var(--muted)}

/* 바닥 시트 */
.sheet-bg{position:fixed;inset:0;background:rgba(10,8,16,.45);z-index:20;display:none}
.sheet-bg.on{display:block}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:640px;max-height:78vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:14px 16px 24px;z-index:21;display:none;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet.on{display:grid;gap:12px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 2px}
.show{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:start}
.show .t{font-weight:700;font-variant-numeric:tabular-nums}
.show .t small{display:block;font-weight:400;color:var(--muted);font-size:11px}

/* 추천 카드 */
.pick{display:grid;grid-template-columns:68px 1fr;gap:12px}
.rank{grid-column:1/-1;font-size:12px;letter-spacing:.06em;font-weight:700;color:var(--hl)}
.when{text-align:center;border-right:2px solid var(--hl);padding-right:10px;font-variant-numeric:tabular-nums;align-self:start}
.when .d{font-size:22px;font-weight:700;line-height:1;font-family:var(--display)}
.when .w{font-size:12px;color:var(--muted)}
.when .t{font-weight:700;margin-top:4px}
.when .badge{display:inline-block;margin-top:6px;font-size:11px;padding:2px 6px;border-radius:4px;background:var(--soft)}
.lead{font-size:16px}
.lead b{font-weight:500;font-size:12px;color:var(--muted);margin-right:2px}
.rest{font-size:13px;color:var(--muted)}
.why{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px}
.why li{padding-left:10px;border-left:2px solid var(--line)}
.nodata{font-size:13px;color:var(--warn)}
/* 배역별 비교 카드: 정보 없는 배우도 같은 크기로 */
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cand{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px;align-content:start;cursor:pointer;min-width:0;background:var(--surface)}
.cand.on{border-color:var(--hl);background:var(--hl-soft)}
.cand.off{opacity:.45;cursor:default}
.cand.ex{border:1px dashed var(--dash);background:var(--bg);opacity:.6}
.cand.ex > :not(.nm):not(.avoid){opacity:.4}
.chip.avoid{justify-self:start;font-size:12px;padding:3px 9px}
.cand .nm{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.cand .nm b{font-size:15px}
.cand .q,.pa .q{font-size:12px;color:var(--muted);line-height:1.45;display:block;background:var(--bg);border-radius:8px;padding:8px 10px}
.q .qm{color:var(--hl);font-weight:800;margin-right:4px}
.cand .cnt{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--hl-soft);color:var(--hl);white-space:nowrap}
.cand .cnt.off{background:var(--soft);color:var(--faint)}
.cand .vote{font-size:11px;color:var(--hl);font-weight:700}
/* 영상 썸네일(탭하면 재생) */
.vth{position:relative;display:block;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--line);text-decoration:none;color:inherit}
.vth img{width:100%;height:100%;object-fit:cover;display:block}
.vth .vcc{position:absolute;left:6px;top:6px;font-size:11px;line-height:1.3;padding:2px 7px;border-radius:999px;background:#fff;color:var(--muted);font-weight:600}
.vth .play{position:absolute;left:6px;bottom:6px;max-width:calc(100% - 12px);font-size:11px;line-height:1.3;padding:2px 7px;border-radius:999px;background:rgba(26,26,26,.72);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vth.none{display:grid;place-items:center;font-size:12px;color:var(--muted)}
.vrow{display:flex;gap:10px;align-items:center;font-size:13px;text-decoration:none;color:inherit}
.vrow img{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:var(--line);flex-shrink:0}
/* 회차별 조합 카드: '갈 수 있는 날'마다 그날의 캐스트를 나란히. 순위·점수 없이 특성 차이만 보여 준다 */
.perf .when{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;border-right:0;padding:0;text-align:left}
.perf .when .t,.perf .when .badge{margin:0}
.perf .leads{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;min-width:0}
.pa{display:grid;gap:6px;align-content:start;min-width:0}
.pa .th{display:grid;place-items:center;aspect-ratio:16/9;width:100%;border-radius:8px;background:var(--soft);color:var(--muted);font-size:11px;overflow:hidden}
.pa .th img{width:100%;height:100%;object-fit:cover;display:block}
.pa .nm{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:0 6px}
.pa .nm b{font-size:15px}
.pa .q{font-size:12px;color:var(--muted);line-height:1.4}
.pa .clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.perf .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.perf .acts .btn{padding:10px;font-size:14px}
details summary{cursor:pointer;color:var(--muted);font-size:14px}
details ul{margin:8px 0 0;padding-left:18px;font-size:14px;color:var(--muted)}
details li span{color:var(--fg)}
.actor{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.actor:first-child{border-top:0}
.actor .name{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.actor .name>span:first-child{white-space:nowrap}
.actor .name>span:last-child{text-align:right}
.actor .name b{font-size:12px;color:var(--muted);font-weight:500;margin-right:6px}

/* 고정 CTA·탭 (앱 배치) */
.cta{position:fixed;left:50%;transform:translateX(-50%);bottom:64px;width:100%;max-width:640px;padding:10px 16px;background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:4}
.tabs{position:fixed;bottom:0;left:0;right:0;width:100%;max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);z-index:5}
.tabs a{text-decoration:none;text-align:center;padding:10px 4px 14px;font-size:12px;color:var(--muted)}
.tabs a.on{color:var(--hl);font-weight:700}
.tabs a .ico{filter:grayscale(1);opacity:.7}.tabs a.on .ico{filter:none;opacity:1}
.tabs a .ico{display:block;font-size:18px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
.undobar{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--fg);color:var(--bg);padding:8px 8px 8px 16px;border-radius:999px;font-size:14px;z-index:31;width:max-content;max-width:calc(100vw - 32px)}
.undobar button{white-space:nowrap;flex:none;background:transparent;border:1px solid currentColor;color:inherit;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.pwrap{position:relative;min-width:0;scroll-snap-align:start}
.pmore{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:999px;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:18px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0;font-family:inherit}
.pmenu{position:absolute;top:42px;right:6px;z-index:5;display:grid;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;min-width:112px}
.pmenu button{border:0;background:transparent;color:var(--fg);text-align:left;padding:9px 10px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.pmenu button:hover{background:var(--soft)}
.askcard{display:grid;gap:10px}
.askcard .btn[disabled]{opacity:.45;cursor:default}
.hidlist{margin-top:4px}
.hidlist>summary{cursor:pointer;color:var(--muted)}
.hidbox{display:grid;gap:6px;margin-top:8px}
.hidrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
pre{background:var(--soft);border-radius:10px;padding:10px;overflow-x:auto;font-size:11px;margin:0}
.score{display:flex;gap:6px}
.score .chip{flex:1;justify-content:center;text-align:center;padding:10px 0}
/* 저장 확인(#saved) · 관람 후(#tag) */
.okmark{width:72px;height:72px;border-radius:50%;background:var(--hl-soft);color:var(--hl);display:grid;place-items:center;font-size:36px;font-weight:700;margin:8px auto 0}
.svh{text-align:center}
.svact{display:grid;gap:10px}
main[data-view=saved],main[data-view=tag]{max-width:640px}
.tmore>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;color:var(--fg);font-size:14px;line-height:1.4}
.tmore>summary::-webkit-details-marker{display:none}
.tmore>summary::after{content:"＋";flex:none;color:var(--muted)}
.tmore[open]>summary{border-color:var(--hl);color:var(--hl)}
.tmore[open]>summary::after{content:"－";color:var(--hl)}
.tmore>div{display:grid;gap:16px;margin-top:16px}

<script>
const D = window.PICKLE_DATA;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STEP_NAMES = ["작품", "누구", "언제", "상세", "관람 후"];  // 캐스트를 먼저 정하고 날짜를 찾는다(설문 64.9%). 화면 하나 = 질문 하나
const ROLE_COLORS = ["var(--r1)", "var(--r2)", "var(--r3)", "var(--r4)", "var(--r5)", "var(--r6)"];

// ---------- 상태 (이 브라우저에만 저장) ----------
const KEY = "pickle_v2";
let S = {prefs: null, query: null, cal: {}, plans: [], tags: [], votes: [], likes: []};  // votes: 같은 배역 두 배우 비교 투표 / likes: 좋아하는 배우 설문 [{actor, why, tags, roles: [{work, role, why, tags}]}]
try { S = Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

// 내가 남긴 관람 태그를 추천 데이터에 합친다 (앱의 핵심 루프)
function mergeMyTags() {
  for (const t of S.tags) {
    if (!t.actor) continue;  // 기분(mood)만 남긴 기록은 추천 데이터에 합칠 게 없다
    for (const tag of t.tags) {
      const rows = ((D.actorTags[t.work] ||= {})[t.actor] ||= []);  // 태그가 있을 때만 배우 항목을 만든다(빈 배열을 남기지 않게)
      if (!rows.some(r => r.tag === tag && r.src === "내 관람"))
        rows.push({role: t.role, tag, src: "내 관람", season: "2026"});
    }
    if (t.partner) for (const tag of t.combo) {
      const list = (D.comboTags[t.work] ||= []);
      if (!list.some(r => r.tag === tag && r.src === "내 관람" && r.a === t.actor && r.b === t.partner))
        list.push({a: t.actor, b: t.partner, role: "조합", tag, src: "내 관람", season: "2026"});
    }
  }
}
mergeMyTags();

// ---------- 추천 규칙 (recommend.py와 동일) ----------
function wantSet(prefs) { const out = new Set(); for (const p of prefs) for (const t of prefT(D, p)) out.add(t); return out; }
function pinsByRole(work, actors) {  // 같은 배역은 '또는', 배역끼리는 '그리고'
  const pins = {};
  for (const r of (D.roles[work] || [])) for (const a of r.cast) if (actors.includes(a)) (pins[r.role] ||= []).push(a);
  return pins;
}
// avoid: 사용자가 직접 뺀 배우. 감점이 아니라 그 배우가 나오는 회차를 후보에서 지운다(하드 필터).
function passes(p, pins, avoid = []) { return !Object.values(p.cast).some(a => avoid.includes(a)) && Object.entries(pins).every(([role, as]) => as.includes(p.cast[role])); }
function recommend(work, lo, hi, prefs, actors = [], top = 2, avoid = []) {
  const want = wantSet(prefs), pins = pinsByRole(work, actors);
  const groups = new Map();
  for (const p of D.perfs) {
    if (p.work !== work || isPrivate(p) || p.date < lo || p.date > hi || !passes(p, pins, avoid)) continue;
    const key = Object.entries(p.cast).sort().map(e => e.join(":")).join("|");
    if (!groups.has(key)) groups.set(key, {cast: p.cast, shows: []});

    g.shows.sort((x, y) => (x.date + x.time).localeCompare(y.date + y.time));
    ranked.push({...g, pts, known, ev, unknown});
  }
  ranked.sort((x, y) => y.pts - x.pts || y.known - x.known || (x.shows[0].date + x.shows[0].time).localeCompare(y.shows[0].date + y.shows[0].time));

V.detail = (work, date, time) => {

  const planned = S.plans.some(x => x.work === work && x.date === date && x.time === time);
  const order = [...leads(work, p.cast), ...rests(work, p.cast)];
  const same = perfsOf(work).filter(x => !(x.date === date && x.time === time) && leads(work, x.cast).every(([r, a]) => p.cast[r] === a)).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  const grade = S.prefs?.grade, priv = isPrivate(p);

    <div class="card accent"><div class="pick" style="grid-template-columns:68px 1fr">${whenTile(p)}
      <div class="head sm">${posterEl(w)}<div><h2>${esc(work)}</h2><p class="tiny muted">${esc(run.label || "")} · ${esc(run.venue || "")}</p></div></div></div></div>
    <div class="card"><h3>이 회차 캐스트</h3>
      <div>${order.map(([role, a]) => { const rs = ((D.actorTags[work] || {})[a] || []).filter(r => !isOfficial(r));
        return `<div class="actor"><div class="name"><span><b>${esc(role)}</b>${esc(a)}</span><span class="small muted">${rs.length ? `태그 ${rs.length}` : "태그 없음"}</span></div>
          ${rs.length ? tagLines(rs, want) + distLine(rs) : `<p class="small muted">아직 리뷰 태그가 없어요.${videoOf(work, a) ? "" : " 공식 영상으로 확인해 보세요."}</p>`}
          ${videoOf(work, a) ? videoRow(videoOf(work, a)) : ""}</div>`; }).join("")}</div>
      <p class="tiny muted">진한 태그가 내 취향과 맞는 거예요.</p></div>
    </div>
    <div class="side">
    ${run.prices?.length ? `<div class="card"><h3>좌석 등급과 가격 <span class="small muted">${esc(run.label)} · 정가 · 할인 전</span></h3>
      <div>${run.prices.map(([g, pr]) => `<div class="between" style="padding:6px 0;border-top:1px solid var(--line)${g === grade ? ";font-weight:700" : ""}"><span>${esc(g)}${g === grade ? ` <span class="tag hit">내 등급</span>` : ""}</span><span style="font-variant-numeric:tabular-nums">${won(pr)}</span></div>`).join("")}</div>
      <p class="tiny muted">남은 좌석은 예매처에서만 볼 수 있어요. ${grade ? `${esc(grade)}이 없으면 아래 '같은 캐스트 다른 회차'로 바로 가요.` : "원하는 등급이 없으면 아래 '같은 캐스트 다른 회차'로 바로 가요."}</p>
      ${run.seatmap ? `<p class="small" style="margin-top:8px"><a href="${esc(run.seatmap.url)}" target="_blank" rel="noopener">${esc(run.venue)} 좌석 배치도 ↗</a> <span class="tiny muted">${esc(run.seatmap.src)}</span></p>` : ""}</div>` : ""}
    <div class="card"><h3>같은 캐스트 다른 회차 <span class="small muted">${same.length}개</span></h3>
      ${same.length ? `<div class="chips">${same.map(x => `<button class="chip" data-go="#detail/${esc(work)}/${x.date}/${x.time}">${md(x.date)}(${esc(x.dow)}) ${esc(x.time)}${x.notes.some(n => /첫공|막공|폐막/.test(n)) ? " ★" : ""}</button>`).join("")}</div>
        <p class="tiny muted">주연 ${leads(work, p.cast).map(([, a]) => esc(a)).join(" · ")}${leads(work, p.cast).length > 1 ? " 조합이" : iga(leads(work, p.cast)[0]?.[1] || "")} 그대로인 날이에요. 조연은 다를 수 있어요.</p>`
        : `<p class="small muted">이 주연 조합은 이 회차뿐이에요. 좌석이 없으면 다른 조합이나 다른 날짜를 골라 주세요.</p>`}</div>
    <div style="display:grid;gap:10px">
    ${priv ? `<button class="btn" disabled>일반 예매 불가</button>` : run.ticket ? "" : `<button class="btn" disabled>예매 링크 준비 중</button>`}
    ${planned ? `<a class="btn" href="#saved/${planIdx(work, date, time)}">볼 예정에 담았어요 · ${run.ticket ? "예매처로 가기" : "담은 공연 보기"} →</a>` : `<button class="btn ${priv || !run.ticket ? "ghost" : ""}" data-act="plan" data-work="${esc(work)}" data-date="${date}" data-time="${time}" ${priv ? "disabled" : ""}>${priv ? "볼 예정에 담을 수 없어요" : "볼 예정에 담기"}</button>`}
    <p class="tiny muted">담아 두면 공연 다음 날 관람 기록을 남길 수 있어요.</p>
    </div>
    </div>`;
};

const MOODS = {good: "좋았어요", meh: "그저 그랬어요", bad: "아쉬웠어요"};
const MOOD_UI = {good: ["😊", "여운이 길게 남아요"], meh: ["😐", "평이한 편이에요"], bad: ["🙁", "기대와 달랐어요"]};  // 관람 후 기분. 한 번만 눌러도 저장할 수 있게 3지선다

// 캘린더 파일(.ics)을 의존성 없이 data: URL로 만든다. DTSTART는 시간대 없는 로컬 시각이라 보는 사람 기기의 시간대로 들어간다. 길이는 2시간 30분으로 고정.
// ponytail: 공연마다 러닝타임이 다르다. 데이터에 러닝타임이 생기면 그 값으로
function icsHref(x, run) {
  const p2 = n => String(n).padStart(2, "0");
  const loc = d => fmt(d).replace(/-/g, "") + "T" + p2(d.getHours()) + p2(d.getMinutes()) + "00";
  const start = new Date(`${x.date}T${x.time}:00`), end = new Date(start.getTime() + 150 * 60000), u = new Date();
  const stamp = `${u.getUTCFullYear()}${p2(u.getUTCMonth() + 1)}${p2(u.getUTCDate())}T${p2(u.getUTCHours())}${p2(u.getUTCMinutes())}${p2(u.getUTCSeconds())}Z`;
  const e = s => String(s).replace(/[\\;,]/g, "\\$&").replace(/\r?\n/g, "\\n");
  const who = leads(x.work, x.cast).map(([, a]) => a).join("·");
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//PICKLE//KO", "CALSCALE:GREGORIAN", "BEGIN:VEVENT",
    `UID:pickle-${x.date}-${x.time.replace(":", "")}-${x.work.replace(/\s+/g, "")}@pickle`, `DTSTAMP:${stamp}`, `DTSTART:${loc(start)}`, `DTEND:${loc(end)}`,
    `SUMMARY:${e(who ? `${x.work} (${who})` : x.work)}`, ...(run?.venue ? [`LOCATION:${e(run.venue)}`] : []), "END:VEVENT", "END:VCALENDAR"].join("\r\n") + "\r\n";
  return "data:text/calendar;charset=utf-8," + encodeURIComponent(ics);
}

// 볼 예정에 담은 직후 화면: 담겼다는 확인 + 다음 행동(예매·좌석·캘린더)

  const run = runOf(x.work, x.date) || {}, file = `pickle-${x.work.replace(/\s+/g, "")}-${x.date}.ics`;
  return `
    <div class="okmark">✓</div>
    <h1 class="svh">볼 예정에 담았어요</h1>
    <div class="card">
      <div class="between"><b>${esc(x.work)}</b><span class="small muted">${md(x.date)}(${esc(x.dow)}) ${esc(x.time)}</span></div>
      ${run.venue ? `<p class="small muted">${esc(run.venue)}</p>` : ""}
      <div class="chips">${castChips(x.work, x.cast)}</div></div>
    <div class="svact">
      ${run.ticket ? `<a class="btn" data-act="ticketSaved" data-i="${+i}" href="${esc(run.ticket)}" target="_blank" rel="noopener">예매처로 이동 ↗</a>
      <p class="tiny muted">예매처에서 <b>${md(x.date)} ${esc(x.time)}</b> 날짜를 다시 골라 주세요(날짜는 자동으로 안 넘어가요).</p>` : `<button class="btn" disabled>예매 링크 준비 중</button>`}
      ${run.seatmap?.url ? `<a class="btn ghost" href="${esc(run.seatmap.url)}" target="_blank" rel="noopener">좌석 배치도 ↗</a>` : ""}
      <a class="btn ghost" download="${esc(file)}" href="${icsHref(x, run)}">내 캘린더에 추가</a>
      <button class="btn ghost" data-go="#home">홈으로</button>
    </div>
    <p class="tiny muted" style="text-align:center">공연 다음 날 '내 공연'에서 관람 기록을 남길 수 있어요.</p>`;
};

V.plans = () => {
  const card = (x, i) => `<div class="card">
      <div class="between"><b>${esc(x.work)}</b><span class="small muted">${md(x.date)}(${esc(x.dow)}) ${esc(x.time)}</span></div>
      <div class="chips">${castChips(x.work, x.cast)}</div>
      ${x.tagged ? `<p class="small" style="color:var(--ok)">기록 남김 ✓</p>` : `<button class="btn" data-go="#tag/${i}">관람 기록 남기기</button>`}
      <button class="chip x" data-act="unplan" data-i="${i}">삭제</button></div>`;
  const items = S.plans.map((x, i) => [x, i]), up = items.filter(([x]) => !isSeen(x)), done = items.filter(([x]) => isSeen(x));
  const works = [...new Set(done.map(([x]) => x.work))];
  const progress = works.map(work => {
    const all = new Set(perfsOf(work).map(p => leadKey(work, p.cast))), seen = [...seenKeys(work)].filter(k => all.has(k)).length;
    return `<div class="card"><div class="between"><b>${esc(work)}</b><span class="small muted">본 조합 ${seen}개 / 전체 ${all.size}개</span></div>
      <div class="bar"><span style="width:${all.size ? Math.round(seen / all.size * 100) : 0}%"></span></div>
      ${seen < all.size ? `<a class="btn ghost" href="#when/${esc(work)}/unseen">아직 안 본 조합 보기 →</a>` : `<p class="small muted">이번 시즌 주연 조합을 다 봤어요</p>`}</div>`;
  }).join("");
  const tab = S.plansTab || (up.length || !done.length ? "up" : "done");
  return `
  <div><p class="eyebrow">내 관람 기록</p><h1>내 공연</h1></div>
  ${S.plans.length ? `
  <div class="seg"><button class="${tab === "up" ? "on" : ""}" data-act="plansTab" data-t="up">볼 예정<b>${up.length}</b></button><button class="${tab === "done" ? "on" : ""}" data-act="plansTab" data-t="done">본 공연<b>${done.length}</b></button></div>
  ${tab === "up" ? `<div class="cards2">${up.map(([x, i]) => card(x, i)).join("") || `<div class="card"><p class="small muted">볼 예정인 공연이 없어요.</p></div>`}</div>`
    : `${progress ? `<h2>본 조합 기록</h2><div class="cards2">${progress}</div>` : ""}
  <div class="cards2">${done.map(([x, i]) => card(x, i)).join("") || `<div class="card"><p class="small muted">아직 본 공연이 없어요.</p></div>`}</div>`}`
  : `<div class="card"><p>아직 담은 공연이 없어요.</p><p class="small muted">회차 상세에서 '볼 예정에 담기'를 누르면 여기 모여요.</p><a class="btn" href="#home">추천 받으러 가기</a></div>`}`;
};

V.tag = i => {
  const x = S.plans[+i]; if (!x) return V.plans();
  setAccent(x.work);
  const ls = leads(x.work, x.cast);
  // 기분(mood) 한 번이면 저장된다. 배우는 '더 남기기'에서 고를 때만 들어간다(안 고르면 비움)
  const t = S.draft && S.draft.i === +i ? S.draft : (S.draft = {i: +i, mood: "", more: false, actor: "", role: "", tags: [], partner: "", combo: [], score: 0, seat: "", view: 0, note: ""});
  const others = ls.filter(([, a]) => a !== t.actor);
  if (t.actor && !others.some(([, a]) => a === t.partner)) t.partner = others[0]?.[1] || "";
  // 'PICKLE의 추천 이유가 실제와 맞았나요?': 이 회차 주연 배우들의 리뷰 태그를 하나씩 맞았어요/달랐어요/모르겠어요로. 고른 취향과 맞는 태그를 먼저, 없으면 배우마다 3개까지. 선택이라 안 눌러도 저장된다
  const wantT = wantSet(S.cal[x.work]?.axes || []), ck = t.check || {};
  const items = ls.flatMap(([, a]) => { const tg = reviewTags(D, x.work, a), mt = tg.filter(g => wantT.has(g)); return (mt.length ? mt : tg.slice(0, 3)).map(g => [a, g]); });
  const checkCard = items.length ? `<div class="card"><h3>PICKLE의 추천 이유가 실제와 맞았나요? <span class="small muted">선택</span></h3>
    ${items.map(([a, g]) => `<div class="chk"><div class="small"><b>${esc(a)}</b> · ${esc(g)}</div><div class="chips">${[["yes", "맞았어요"], ["no", "달랐어요"], ["?", "모르겠어요"]].map(([v, l]) => `<button class="chip x ${ck[a + "|" + g] === v ? "on" : ""}" data-act="tCheck" data-k="${esc(a + "|" + g)}" data-v="${esc(v)}">${l}</button>`).join("")}</div></div>`).join("")}
    <p class="tiny muted">'달랐어요'는 취향이 아니라 그 배우의 특성이 안 보였다는 뜻으로 읽어요.</p></div>` : "";
  return `
    <div><p class="eyebrow">관람 기록</p><h1>어땠어요?</h1></div>
    <p class="muted small">${esc(x.work)} · ${md(x.date)} ${esc(x.time)}</p>
    <div class="card"><h3>오늘 공연 어땠어요?</h3><div class="moods">${Object.entries(MOODS).map(([k, l]) => `<button class="mood ${t.mood === k ? "on" : ""}" data-act="tMood" data-m="${k}"><span class="em">${MOOD_UI[k][0]}</span><b>${l}</b><small>${MOOD_UI[k][1]}</small></button>`).join("")}</div></div>
    ${checkCard}
    <details id="more" class="tmore"${t.more ? "open" : ""} ontoggle="S.draft&&(S.draft.more=this.open)"><summary>더 남기기 (선택) — 남기면 다음 추천에 반영돼요</summary><div>
    <div class="card"><h3>인상 깊었던 배우</h3><div class="chips">${ls.map(([r, a]) => `<button class="chip role ${t.actor === a ? "on" : ""}" style="--rc:${roleColor(x.work, r)}" data-act="tActor" data-a="${esc(a)}" data-r="${esc(r)}">${esc(a)}<small>${esc(r)}</small></button>`).join("")}</div></div>
    ${t.actor ? `<div class="card"><h3>${esc(t.actor)}의 어떤 점이 좋았어요? <span class="small muted">최대 3개</span></h3>
      ${(D.actorTagGroups || []).map(([g, tags]) => `<p class="tiny muted" style="margin:10px 0 4px">${esc(g.replace("배우 · ", ""))}</p><div class="chips">${tags.map(tag => `<button class="chip ${t.tags.includes(tag) ? "on" : ""}" data-act="tTag" data-t="${esc(tag)}" ${!t.tags.includes(tag) && t.tags.length >= 3 ? "disabled" : ""}>${esc(D.actorTagLabels[tag])}<small>${esc(tag)}</small></button>`).join("")}</div>`).join("")}</div>` : ""}
    ${(() => { const same = ((D.roles[x.work] || []).find(r => r.role === t.role)?.cast || []).filter(a => a !== t.actor), cmp = (t.cmp ||= {}); return same.length ? `<div class="card"><h3>같은 ${esc(t.role)} 역, 전에 본 배우와 비교하면? <span class="small muted">본 적 있는 배우만 · 선택</span></h3>
      ${same.map(b => `<div class="between" style="flex-wrap:wrap"><span>${esc(b)}</span><div class="chips">${[["skip", "안 봤어요"], ["a", `${t.actor} 쪽`], ["tie", "비슷"], ["b", `${b} 쪽`]].map(([v, l]) => `<button class="chip x ${(cmp[b] || "skip") === v ? "on" : ""}" data-act="tCmp" data-b="${esc(b)}" data-v="${v}">${esc(l)}</button>`).join("")}</div></div>`).join("")}
      <p class="tiny muted">같은 배역을 다른 배우로도 봤다면 끌렸던 쪽을 골라 주세요. 다음 추천에 '내 취향에 가까웠던 쪽'으로 쓰여요.</p></div>` : ""; })()}
    ${t.actor && others.length ? `<div class="card"><h3>상대 배우와의 합은요? <span class="small muted">선택</span></h3>

function exportRows() {
  const out = [];
  for (const t of S.tags) {
    const venue = runOf(t.work, t.date)?.venue || "", show = `${md(t.date)} ${t.time}`;
    // 좌석·시야는 태그 기록 탭에 열이 없어서 메모 열에 같이 적는다. 좌석 탭이 생기면 분리한다.
    const note = [t.note, t.seat ? `좌석 ${t.seat}` : "", t.view ? `시야 ${t.view}/5` : ""].filter(Boolean).join(" · ");
    // 기분만 남겨도 행 1개는 나간다: 종류 '관람', 태그 열에 기분. 배우·배역은 '더 남기기'에서 골랐을 때만 채워진다
    if (t.mood || !t.tags.length) out.push([t.at, "앱", t.work, "2026", venue, show, "관람", t.role, t.actor, "", MOODS[t.mood] || "", note, "직접 관람", ""]);
    for (const tag of t.tags) out.push([t.at, "앱", t.work, "2026", venue, show, "배우", t.role, t.actor, "", tag, note, "직접 관람", ""]);
    if (t.partner) for (const tag of t.combo) out.push([t.at, "앱", t.work, "2026", venue, show, "조합", t.role, t.actor, t.partner, tag, note, "직접 관람", ""]);
  }
  // 같은 배역 비교 투표: 종류 '비교', 배우=내가 본 쪽, 상대 배우=비교 대상, 태그 열에 결과
  for (const v of S.votes) out.push([v.at, "앱", v.work, "2026", runOf(v.work, v.date)?.venue || "", `${md(v.date)} ${v.time}`, "비교", v.role, v.a, v.b, v.result === "a" ? "더 좋았다" : v.result === "b" ? "덜 좋았다" : "비슷", "같은 배역 비교 투표", "직접 관람", ""]);
  return out;
}

// <proto-flow>
// 새 화면 흐름의 순수 부분(주소 이동 · 추천 극 · 추천 조합 · 평가 반영 · 관람 후 질문 · 기록 한 줄 만들기). D·S 만 보고 화면은 그리지 않는다 — tests/proto_check.js 가 이 블록을 꺼내 검증한다.
// 흐름: 진입 → (처음이면) 취향폼 → 홈 → 극 요약(추천 조합 + '이 조합 어때요?') → (회차 있으면) 달력 → 그날 회차 → 볼 예정 담기·예매처 / (회차 없으면) 공연 시간·예매처
const iga = n => { const c = String(n).charCodeAt(String(n).length - 1) - 0xAC00; return c >= 0 && c % 28 ? "이" : "가"; };
const wagwa = n => { const c = String(n).charCodeAt(String(n).length - 1) - 0xAC00; return c >= 0 && c % 28 ? "과" : "와"; };
// 취향을 한 번이라도 다룬(건너뛰기 포함) 사람, 또는 예전 앱에서 쓴 기록(볼 예정·관람 기록·비교 투표·좋아하는 배우 설문)이 있는 사람은 곧바로 홈, 처음 온 사람만 취향폼
const entryRoute = (prefs, state = null) => prefs || (state && ["plans", "tags", "votes", "likes"].some(k => (state[k] || []).length)) ? "#home" : "#taste/1";
// 취향폼 1→2→3, 3 다음은 바로 홈(추천). 끌리는 배우 고르기는 내 취향·#duel 화면에서 하고 싶은 사람만
const tasteNext = step => +step >= 3 ? "#home" : "#taste/" + (+step + 1);
const showRef = (D, key) => {  // 극 요약 주소의 키: 시드 작품은 작품 이름, KOPIS 공연은 mt20id
  const w = (D.works || []).find(x => x.name === key); if (w) return {kind: "seed", key, w, title: w.name};
  const s = (D.currentShows || []).find(x => x.id === key); return s ? {kind: "current", key, s, title: s.title} : null;
};
const isRunning = (D, w, from) => w.hasSchedule ? !!runningLeads(D, w, from) : !ended(w, from);
// 구분(대학로 / 대학로 외, 화면에는 안 쓴다): export 가 붙인 area 값('확인 필요'는 대학로 외로 보내고 따로 안 드러낸다). 값이 없는 옛 data.js 면 임시 규칙(공연명·공연장에 '대학로')
const areaOf = x => { if (x.area) return x.area === "대학로" ? "대학로" : "대학로 외"; const venue = x.venue || (x.runs || []).map(r => r.venue).join(" "); return /대학로/.test(`${x.title || x.name || ""} ${venue}`) ? "대학로" : "대학로 외"; };
// 지금 하는 공연 전체 = 끝나지 않은 시드 작품 + 지금 하는 KOPIS 공연(18세 이상·끝난 공연은 liveShows 규칙대로 뺀다). sched: 회차 캐스팅이 있는 작품
// 출연진 정보가 없는 KOPIS 공연(noCast): 같은 규칙(끝나지 않음·18세 미만·시드와 같은 공연 아님)으로 전체 목록에만 나온다. 추천 줄·비슷한 배우 계산은 liveShows(출연진 있는 것)만 쓴다
const noCastShows = (D, from) => (D.currentShows || []).filter(s => s.noCast && s.end >= from && minAge(s.age) < 18 && !(D.works || []).some(w => String(s.title).replace(/\s+/g, "").includes(w.name.replace(/\s+/g, ""))));
// 각 공연: region(지역 칩, export 가 공연장 주소로 붙임), pop(예매상황판 순위, 없으면 null — 정렬에만 쓰고 화면엔 안 보인다), start(시작일 — 시드 작품은 지금 하는 회차의 시작)
const seedStart = (w, from) => { const rs = w.runs || [], live = rs.filter(r => r.end >= from); return (live.length ? live : rs).map(r => r.start).sort()[0] || ""; };
const allShows = (D, from) => [...D.works.filter(w => isRunning(D, w, from)).map(w => ({key: w.name, kind: "seed", title: w.name, area: areaOf(w), region: w.region || "", pop: w.popularity ?? null, start: seedStart(w, from), sched: !!w.hasSchedule})),
  ...[...liveShows(D, from), ...noCastShows(D, from)].map(s => ({key: s.id, kind: "current", title: s.title, area: areaOf(s), region: s.region || "", pop: s.popularity ?? null, start: s.start || "", sched: false, noCast: !!s.noCast}))];
// 지금 하는 공연 전체의 인기순: 순위가 있는 공연이 먼저(순위 오름차순), 순위 없는 공연은 그 뒤에 시작일이 오늘과 가까운 순(같으면 제목순)
const startGap = (x, from) => x.start ? Math.abs(Date.parse(x.start) - Date.parse(from)) : Infinity;
const byPopularity = (list, from) => [...list].sort((a, b) => (a.pop ?? Infinity) - (b.pop ?? Infinity) || (a.pop == null ? startGap(a, from) - startGap(b, from) : 0) || a.title.localeCompare(b.title, "ko"));
// 지역 칩: [전체] + 공연 수 많은 순(같으면 가나다순)의 지역 + 맨 끝 [그 외 지역](공연이 1개뿐인 지역과 지역을 못 읽은 공연). 대학로도 다른 지역과 똑같이 취급한다. 지역이 하나뿐이면 [전체]만(칩이 필요 없다)
const OTHER_REGION = "그 외 지역", MIN_REGION = 2;
const regionTabs = list => {
  const n = {}; for (const x of list) if (x.region) n[x.region] = (n[x.region] || 0) + 1;
  const big = Object.keys(n).filter(g => n[g] >= MIN_REGION).sort((a, b) => n[b] - n[a] || a.localeCompare(b, "ko")), other = list.filter(x => !big.includes(x.region)).length;
  const tabs = [["all", "전체", list.length], ...big.map(g => [g, g, n[g]]), ...(other ? [[OTHER_REGION, OTHER_REGION, other]] : [])];
  return tabs.length > 2 ? tabs : tabs.slice(0, 1);
};
const regionKeyOf = (x, tabs) => tabs.some(t => t[0] === x.region && t[0] !== "all") ? x.region : OTHER_REGION;
const showsIn = (all, tabs, tab, from) => byPopularity(tab === "all" ? all : all.filter(x => regionKeyOf(x, tabs) === tab), from);
// 극 요약 다음 단계: 회차 캐스팅이 있고 아직 하는 시드 작품은 달력, 그 밖(회차 없는 작품·KOPIS 공연)은 화면 안에 공연 시간·예매처를 보여 준다
const showNext = (D, ref, from) => ref.kind === "seed" && ref.w.hasSchedule && isRunning(D, ref.w, from) ? {type: "calendar", hash: "#cal/" + ref.key} : {type: "inline"};
const dayHash = (work, date) => `#day/${work}/${date}`;
// 달력: 앞으로 남은 회차가 있는 날 → 그날의 회차들(전체대관 제외)
const calDays = (D, work, from) => { const out = {}; for (const p of D.perfs) if (p.work === work && p.date >= from && !isPrivate(p)) (out[p.date] ||= []).push(p); for (const d in out) out[d].sort((a, b) => a.time.localeCompare(b.time)); return out; };
const likeTagsFor = (S, a) => { const l = (S.likes || []).find(x => x.actor === a); return l ? [...(l.tags || []), ...(l.roles || []).flatMap(r => r.tags || [])] : []; };

// 고른 취향 카드와 맞는 KOPIS 공연: 작품 테마 태그(D.workTags[공연 제목], 소개 글에서 단 것)가 있는 공연만. 맞는 카드가 많은 순(같으면 제목순). 테마는 소개 글에서 온 것이라 출연진이 없는 공연도 된다
const likeCurrent = (D, ids, from = "") => [...liveShows(D, from), ...noCastShows(D, from)]
  .map(s => { const ts = workTagSet(D, s.title); return {s, cards: ids.map(cardOf).filter(c => c && cardHit(c, ts))}; })
  .filter(x => x.cards.length).sort((a, b) => b.cards.length - a.cards.length || a.s.title.localeCompare(b.s.title, "ko"));
// ---- 홈 '내 취향 추천 극': 지금 하는 시드 작품 + KOPIS 공연 중 근거가 있는 것만, 극마다 추천 이유(근거 순: 좋아하는 배우 출연 → 닮은 배우 → 공연 카드 → 취향 축). 추천 로직은 앱 규칙 그대로(likeWorks · actorChips · similarWorks)
// 평가 반영: 낮게 평가한 배우(S.proto.avoidActors)는 '닮은 배우' 이유에서 빠진다.
const REASON_ORDER = {"fav-here": 0, "fav-sim": 1, card: 2, axis: 3};
const homeRecs = (D, S, from) => {
  const p = S.prefs || {}, by = new Map(), avoidA = new Set([...(S.proto?.avoidActors || []), ...(p.avoid || [])]);
  const add = (key, kind, title, reason, n = 0) => {
    const e = by.get(key) || {key, kind, title, reasons: [], n: 0};
    if (!e.reasons.some(r => r.text === reason.text)) e.reasons.push(reason);
    e.n += n; by.set(key, e);
  };
  for (const x of likeWorks(D, p.works || [], from)) if (isRunning(D, x.w, from)) add(x.w.name, "seed", x.w.name, {type: "card", text: `${x.cards.map(c => c.l).join(" · ")} 취향과 맞아요`, sentence: `${x.cards.map(c => c.l).join(" · ")} 취향과 맞는 작품이에요`}, x.cards.length);
  for (const x of likeCurrent(D, p.works || [], from)) {  // KOPIS 공연: '고른 ○○와 맞는 공연이에요'
    const ls = x.cards.map(c => `'${c.l}'`).join(" · "), text = `고른 ${ls}${wagwa(x.cards[x.cards.length - 1].l)} 맞는 공연이에요`;
    add(x.s.id, "current", x.s.title, {type: "card", text, sentence: text}, x.cards.length);
  }
  const axes = p.axes || [];
  if (axes.length) for (const w of D.works) {
    if (!isRunning(D, w, from)) continue;
    const cs = actorChips(D, w.name, axes, from).filter(c => !avoidA.has(c.a));
    if (cs.length) add(w.name, "seed", w.name, {type: "axis", text: `취향에 맞는 배우: ${cs.slice(0, 3).map(c => `${c.a} · ${c.tags[0]}`).join(", ")}${cs.length > 3 ? " 등" : ""}`, sentence: `취향에 맞는 배우가 나와요: ${cs.slice(0, 2).map(c => `${c.a}(${c.tags[0]})`).join(", ")}`}, 1);
  }
  for (const a of (p.favs || []).slice(0, 3)) for (const r of similarWorks(D, a, likeTagsFor(S, a), from)) {
    const key = r.w.current ? r.w.id : r.w.name, kind = r.w.current ? "current" : "seed";
    if (r.here) add(key, kind, r.w.name, {type: "fav-here", text: `${a} 출연 중`, sentence: `좋아하는 ${a}${iga(a)} 출연 중이에요`, actor: a}, 3);
    for (const g of r.groups.slice(0, 2)) { const names = g.names.filter(x => !avoidA.has(x)); if (names.length) add(key, kind, r.w.name, {type: "fav-sim", text: `${a}처럼 ${g.labels.join("·")} — ${names.join("·")}`, sentence: `좋아하는 ${a}처럼 ${g.labels.join("·")} 배우가 나와요 (${names.join("·")})`, fav: a, labels: g.labels, names}, g.score); }
  }
  const rank = e => Math.min(...e.reasons.map(r => REASON_ORDER[r.type]));
  return [...by.values()].map(e => { e.reasons.sort((x, y) => REASON_ORDER[x.type] - REASON_ORDER[y.type]); return {...e, line: e.reasons[0].text, sentence: e.reasons[0].sentence || e.reasons[0].text}; })
    .sort((x, y) => rank(x) - rank(y) || y.reasons.length - x.reasons.length || y.n - x.n || x.title.localeCompare(y.title, "ko"));
};

// ---- 홈 추천 줄. 좋아하는 배우가 있으면 줄 A '좋아하는 배우가 나와요'(출연하는 극, 포스터 아래 '○○ 출연')와 줄 B '비슷한 배우가 나와요'(목소리 특성이 비슷한 배우가 나오는 극, 이유를 붙인다 · A 에 나온 극은 뺀다).
// 없으면 지금처럼 취향 카드·축 기준 한 줄(taste). 근거가 하나도 없으면 none
const homeRows = (D, S, from) => {
  const hid = hiddenShows(S), favs = ((S.prefs || {}).favs || []).slice(0, 3), recs = homeRecs(D, S, from).filter(r => !hid[r.key]);  // 숨긴 공연은 추천 줄 어디에서도 뺀다
  if (!favs.length) return {mode: recs.length ? "taste" : "none", taste: recs, A: [], B: []};
  const A = [], inA = new Set(), B = [];
  for (const r of recs) { const here = [...new Set(r.reasons.filter(x => x.type === "fav-here").map(x => x.actor))]; if (here.length) { A.push({key: r.key, title: r.title, kind: r.kind, line: `${here.join("·")} 출연`}); inA.add(r.key); } }
  for (const r of recs) { if (inA.has(r.key)) continue; const sim = r.reasons.find(x => x.type === "fav-sim"); if (sim) B.push({key: r.key, title: r.title, kind: r.kind, line: `${sim.fav}처럼 ${sim.labels.join("·")} — ${sim.names.join("·")} 출연`}); }
  const used = new Set([...A, ...B].map(x => x.key));
  return {mode: "fav", taste: recs.filter(r => !used.has(r.key)).map(r => ({key: r.key, title: r.title, kind: r.kind, line: r.line})), A, B};  // 카드·축 추천 중 A·B 에 없는 공연('내 취향 추천' 줄)
};

// ---- 추천 조합(회차 캐스팅이 있는 작품): 남은 회차를 주연 배우 조합별로 묶어, 취향 근거(앱 규칙 V.when 의 hit·반대 근거·내 기록 pers)가 가장 큰 조합. ⭐ 꼭 볼 배우·🚫 뺄 배우·낮게 평가해 내린 조합·이미 본 조합·'설명이 틀렸어요'로 뺀 배우 근거·이상형 월드컵 선택은 반영한다
const wantOf = (D, prefs) => new Set((prefs || []).flatMap(p => prefT(D, p)));
const leadsOf = (D, work, cast) => Object.entries(cast).filter(([r]) => ((D.roles[work] || []).find(x => x.role === r)?.weight || "조연") === "주연");
const comboKey = (D, work, cast) => leadsOf(D, work, cast).map(([r, a]) => r + ":" + a).sort().join("|");
const tagsOfActor = (D, work, a) => ((D.actorTags[work] || {})[a] || []).filter(r => !isOfficial(r));  // 배우 본인·제작진 공식 출처는 근거·점수 밖
const wrongOf = (S, work) => S.proto?.wrong?.[work] || [];  // 사용자가 '설명이 틀렸어요'로 고른 배우: 이 작품 추천에서 그 배우의 태그 근거는 쓰지 않는다
// 한 조합({배역: 배우})의 취향 근거: 배우별 맞춘 태그, 조합 태그, hit(서로 다른 (배우, 취향) 쌍, 쌍마다 w(취향) 만큼), 반대 근거. skip 한 배우의 근거는 뺀다
const comboEvidence = (D, prefs, work, cast, skip = [], w = () => 1) => {
  const want = wantOf(D, prefs), lead = leadsOf(D, work, cast).filter(([, a]) => !skip.includes(a)), ev = [], names = lead.map(([, a]) => a);
  for (const [r, a] of lead) for (const x of tagsOfActor(D, work, a)) if (want.has(x.tag)) ev.push({who: a, role: r, ...x});
  for (const c of (D.comboTags[work] || [])) if (names.includes(c.a) && names.includes(c.b) && want.has(c.tag) && !isOfficial(c)) ev.push({...c, who: `${c.a}×${c.b}`, role: "조합"});
  const hit = [...new Set(ev.flatMap(e => (prefs || []).filter(p => prefT(D, p).includes(e.tag)).map(p => e.who + "|" + p)))].reduce((n, k) => n + w(k.slice(k.indexOf("|") + 1)), 0);
  const oppBy = {};
  for (const p of prefs || []) for (const x of D.axes) if (x.left !== "가창" && (x.left === p || x.right === p)) oppBy[p] = new Set((D.axis[x.left === p ? x.right : x.left] || []).filter(t => !want.has(t)));
  const bad = lead.flatMap(([r, a]) => {  // 한 배우가 같은 축의 양쪽 태그를 다 가졌으면 그 축의 반대 근거는 쓰지 않는다
    const mine = new Set(tagsOfActor(D, work, a).map(x => x.tag)), against = new Set((prefs || []).filter(p => oppBy[p] && !prefT(D, p).some(t => mine.has(t))).flatMap(p => [...oppBy[p]]));
    return tagsOfActor(D, work, a).filter(x => against.has(x.tag)).map(x => ({who: a, role: r, ...x}));

};
const pinsOf = (S, work) => { const P = S.proto?.pins?.[work] || {}; return {star: P.star || [], avoid: P.avoid || []}; };
// 이상형 월드컵 반영: 고른 배우가 나오는 조합 +1, 진 배우가 나오는 조합 -1(비슷해요는 무효), 합은 ±2 까지
const duelsOf = (S, work) => (S.proto?.duels || []).filter(d => d.work === work);
const duelBonus = (S, work, cast) => { let n = 0; for (const d of duelsOf(S, work)) { if (d.result === "tie") continue; const a = cast[d.role]; if (a === d.win) n++; else if (a === d.lose) n--; } return Math.max(-2, Math.min(2, n)); };
const comboRecs = (D, S, work, from) => {
  const prefs = S.prefs?.axes || [], pw = personalWeights(S, D), hasPW = Object.keys(pw).length > 0, {star, avoid} = pinsOf(S, work), hide = new Set(S.proto?.hide?.[work] || []), wrong = wrongOf(S, work);
  const prio = S.prefs?.prio || "", must = S.prefs?.must || [], never = S.prefs?.avoid || [];  // 취향폼 1/3: '반드시 볼 배우'는 ⭐처럼, '피하고 싶은 배우'는 조연이어도 그 회차를 뺀다
  const seen = new Set((S.plans || []).filter(x => x.work === work && (x.tagged || x.date < from)).map(x => comboKey(D, work, x.cast)));
  const starByRole = {};  // 같은 배역의 ⭐는 '또는', 배역끼리는 '그리고'
  for (const r of D.roles[work] || []) if (r.weight === "주연") for (const a of r.cast) if (star.includes(a) || must.includes(a)) (starByRole[r.role] ||= []).push(a);
  const groups = new Map();
  for (const p of D.perfs) {
    if (p.work !== work || p.date < from || isPrivate(p) || Object.values(p.cast).some(a => never.includes(a))) continue;
    const k = comboKey(D, work, p.cast), g = groups.get(k) || {key: k, cast: Object.fromEntries(leadsOf(D, work, p.cast)), perfs: []};
    g.perfs.push(p); groups.set(k, g);
  }
  const won = new Set(duelsOf(S, work).filter(d => d.result !== "tie").map(d => d.win)), out = [];
  for (const g of groups.values()) {
    const names = Object.values(g.cast);
    if (seen.has(g.key) || hide.has(g.key) || names.some(a => avoid.includes(a)) || Object.entries(starByRole).some(([r, as]) => !as.includes(g.cast[r]))) continue;
    const e = comboEvidence(D, prefs, work, g.cast, wrong, p => prefWeight(prio, p));
    const pc = hasPW ? names.flatMap(a => [...new Set(tagsOfActor(D, work, a).map(x => x.tag))].filter(tg => pw[tg]).map(tg => pw[tg])) : [];
    // 배역 싱크로는 묻지 않고 기본 가산점(배우마다 0.5). 취향 근거가 있는 조합끼리 순서만 바꾸고, 이것만으로는 추천하지 않는다
    const sync = e.hit > 0 ? names.filter(a => !wrong.includes(a) && tagsOfActor(D, work, a).some(x => x.tag === "배역 싱크로")).length * 0.5 : 0;
    const pers = Math.max(-2, Math.min(2, pc.reduce((n, x) => n + x, 0))), duel = duelBonus(S, work, g.cast), score = e.hit + sync + pers + duel;
    if (!(score > 0 && (e.hit > 0 || pers > 0 || duel > 0))) continue;  // 취향 근거도 내 기록도 내가 고른 이상형도 없으면 추천하지 않는다
    const dates = [...new Set(g.perfs.map(p => p.date))].sort();
    out.push({...g, ...e, pers, duel, score, dates, duelNames: names.filter(a => won.has(a)), evByActor: Object.fromEntries(names.map(a => [a, [...new Set(e.ev.filter(x => x.who === a).map(x => x.tag))]])), comboTags: [...new Set(e.ev.filter(x => x.role === "조합").map(x => x.tag))]});
  }
  return out.sort((x, y) => y.score - x.score || x.bad.length - y.bad.length || y.perfs.length - x.perfs.length || x.dates[0].localeCompare(y.dates[0]));
};
// ⭐/🚫: 같은 배우에 둘 중 하나. 다시 누르면 해제. 지금 상태('star'/'avoid'/'')를 돌려준다
const togglePin = (S, work, actor, kind) => {
  const P = ((S.proto ||= {}).pins ||= {})[work] ||= {star: [], avoid: []}, had = P[kind].includes(actor);
  P.star = P.star.filter(a => a !== actor); P.avoid = P.avoid.filter(a => a !== actor);
  if (!had) P[kind].push(actor);
  return P.star.includes(actor) ? "star" : P.avoid.includes(actor) ? "avoid" : "";
};
// 영상 반응(공연 화면 ② 배우 칸): 썸네일(영상 ID 있는 것만)을 누르면 '이 영상 어땠어요?'가 나온다. (작품, 배우, 영상 ID)별로 S.proto.vr[작품][배우][ID] = {r?} — 있으면 연 상태, r 은 마지막 답
const VIDEO_REACTIONS = [["like", "마음에 들어요"], ["unsure", "모르겠어요"], ["dislike", "취향 아니에요"]];
const vrOf = (S, work, actor, vid) => S.proto?.vr?.[work]?.[actor]?.[vid] || null;  // null = 아직 안 연 영상
const openVideo = (S, work, actor, vid) => { const o = (((S.proto ||= {}).vr ||= {})[work] ||= {})[actor] ||= {}; return o[vid] ||= {}; };
// '마음에 들어요' 뒤에만 '어떤 점이 좋았어요? (선택)' 특징 칩(e.t = 고른 태그, 최대 6): 사전 확정 목소리 태그 6개. 다른 답으로 바꾸면 고른 특징은 지운다(부정적인 답에는 특징을 모으지 않는다)
const vrTagList = D => askTagList(D).slice(0, 6);
const setVideoReaction = (S, work, actor, vid, r) => { if (!VIDEO_REACTIONS.some(x => x[0] === r)) return null; const e = openVideo(S, work, actor, vid); if (e.r === r) return null; e.r = r; if (r !== "like") delete e.t; return r; };  // 바뀌었으면 r, 같으면 null(기록도 안 남긴다)
const toggleVideoTrait = (D, S, work, actor, vid, tag) => { const e = vrOf(S, work, actor, vid); if (!e || e.r !== "like" || !vrTagList(D).includes(tag)) return null; const t = e.t || []; e.t = t.includes(tag) ? t.filter(x => x !== tag) : [...t, tag].slice(0, 6); return e.t; };  // 고른 목록(비었을 수도 있음), 칩이 아니거나 like 가 아니면 null
const videoReactionRecord = (work, role, actor, vid, r, traits) => ({work, role, actor, video: vid, reaction: r, ...(traits ? {traits} : {})});
const pinStateOf = (S, work, actor) => { const {star, avoid} = pinsOf(S, work); return star.includes(actor) ? "star" : avoid.includes(actor) ? "avoid" : ""; };
// ---- 공연 화면(#show): ① 요약 ② 누구로 볼까요?(주연 배역마다 배우 선택, 추천 조합은 미리 선택) ③ 이 조합으로 볼 수 있는 날(한 달 달력). 고른 조합 = 배역 → 배우
const leadRolesOf = (D, work) => (D.roles[work] || []).filter(r => r.weight === "주연");
const topRec = (D, S, work, from) => comboRecs(D, S, work, from)[0] || null;
// 미리 선택: 추천 1순위 조합, 추천이 없으면 가장 빠른 회차의 주연 조합(PICK 표시는 추천이 있을 때만)
const defaultSel = (D, S, work, from) => {
  const top = topRec(D, S, work, from); if (top) return {...top.cast};
  const p = D.perfs.filter(x => x.work === work && x.date >= from && !isPrivate(x)).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time))[0];
  return p ? Object.fromEntries(leadsOf(D, work, p.cast)) : {};
};
// 지금 선택: 사용자가 누른 배우가 있으면 그걸(아직 나오는 배우만), 나머지 배역은 미리 선택을 따른다
const curSel = (D, S, work, from) => {
  const d = defaultSel(D, S, work, from), mine = S.proto?.sel?.[work] || {}, out = {};
  for (const r of leadRolesOf(D, work)) { const c = duelCands(D, work, r.role, from), a = mine[r.role] && c.includes(mine[r.role]) ? mine[r.role] : d[r.role] || c[0]; if (a) out[r.role] = a; }
  return out;
};
const selPerfs = (D, work, sel, from) => D.perfs.filter(p => p.work === work && p.date >= from && !isPrivate(p) && Object.entries(sel).every(([r, a]) => p.cast[r] === a)).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
const selDates = (D, work, sel, from) => [...new Set(selPerfs(D, work, sel, from).map(p => p.date))];
// 배우를 누르면 그 배역만 바뀐다(나머지 배역은 지금 선택 그대로 굳힌다). 달력은 첫 달·고른 날 없음으로 돌아간다. 바뀌기 전 배우를 돌려준다(비교 제안용)
const setSel = (D, S, work, role, actor, from) => {
  const before = curSel(D, S, work, from)[role], P = (S.proto ||= {});
  (P.sel ||= {})[work] = {...curSel(D, S, work, from), [role]: actor};
  for (const k of ["cm", "cd"]) if (P[k]) delete P[k][work];
  if (before && before !== actor) (P.cmp ||= {})[work] = {role, a: before, b: actor}; else if (P.cmp) delete P.cmp[work];
  return before;
};
const setSelCast = (S, work, cast) => { const P = (S.proto ||= {}); (P.sel ||= {})[work] = {...cast}; for (const k of ["cm", "cd", "cmp"]) if (P[k]) delete P[k][work]; };
// 고른 조합이 같이 나오는 날이 없을 때: 한 배역만 바꾸면 볼 수 있는 배우와 날 수
const relaxHints = (D, work, sel, from) => Object.keys(sel).map(role => {
  const others = Object.fromEntries(Object.entries(sel).filter(([r]) => r !== role)), by = {};
  for (const p of selPerfs(D, work, others, from)) { const a = p.cast[role]; if (a && a !== sel[role]) (by[a] ||= new Set()).add(p.date); }
  return {role, options: Object.entries(by).map(([actor, ds]) => ({actor, n: ds.size})).sort((x, y) => y.n - x.n || x.actor.localeCompare(y.actor, "ko"))};
}).filter(h => h.options.length);
// 한 달 달력: 볼 수 있는 날이 있는 첫 달부터 마지막 달까지(비는 달도 넘길 수 있게 이어서)
const monthRange = dates => { if (!dates.length) return []; const out = []; let m = dates[0].slice(0, 7); const last = dates[dates.length - 1].slice(0, 7); while (m <= last && out.length < 24) { out.push(m); const [y, mo] = m.split("-").map(Number); m = mo === 12 ? `${y + 1}-01` : `${y}-${String(mo + 1).padStart(2, "0")}`; } return out; };
const calMonthOf = (S, work, dates) => { const ms = monthRange(dates), cm = S.proto?.cm?.[work]; return ms.includes(cm) ? cm : ms[0] || ""; };
const calMove = (S, work, dates, delta) => { const ms = monthRange(dates), i = Math.max(0, ms.indexOf(calMonthOf(S, work, dates))), m = ms[Math.max(0, Math.min(ms.length - 1, i + delta))]; ((S.proto ||= {}).cm ||= {})[work] = m; return m; };
const calDayOf = (S, work, dates) => dates.includes(S.proto?.cd?.[work]) ? S.proto.cd[work] : "";
// 요약 한 줄 정보의 '최저~': 시드는 등급별 가격 표, KOPIS 는 가격 안내 글에서 숫자(원)를 뽑는다
const priceMin = prices => { const n = (prices || []).map(p => Array.isArray(p) ? p[1] : 0).filter(x => x > 0); return n.length ? Math.min(...n) : 0; };
const priceMinText = t => { const n = [...String(t || "").matchAll(/(\d{1,3}(?:,\d{3})+|\d{4,})\s*원/g)].map(m => +m[1].replace(/,/g, "")).filter(x => x >= 1000); return n.length ? Math.min(...n) : 0; };
// 취향폼 끝 선택 단계: 추천 1순위(회차 캐스팅이 있는) 작품의 주연 배역으로 이상형 월드컵
const resetCombo = (S, work) => { const P = S.proto; if (!P) return; for (const k of ["pins", "hide", "wrong", "duelCur", "duelRound", "pinAsk", "sel", "cm", "cd", "cmp"]) if (P[k]) delete P[k][work]; P.duels = (P.duels || []).filter(d => d.work !== work); };

// ---- 기록 한 줄 만들기(정의서 6종). 여기서 만든 값은 기록기(track)가 한 번 더 걸러서 쌓는다
// 취향 스냅숏: 5축 값(왼쪽을 골랐으면 -1, 오른쪽 +1, 안 골랐으면 0 · 지금 화면은 3지선다라 ±1 만 쓴다), 좋아하는 배우, 고른 카드의 태그
const tasteSnapshot = (D, S) => { const p = S.prefs || {}, ax = p.axes || [], cards = p.works || [];
  return {axes: Object.fromEntries(D.axes.map(a => [a.left, ax.includes(a.left) ? -1 : ax.includes(a.right) ? 1 : 0])), favs: (p.favs || []).slice(0, 3), tags: [...new Set(cards.flatMap(id => cardOf(id)?.tags || []))].slice(0, 12)}; };
// taste_snapshot: 좋아하는 배우는 앱 데이터에 있는 이름(actors Set)만 — 이름 칸에 아무 글이나 쓸 수 있어서. 취향 5축 값·고른 태그는 tasteSnapshot 그대로
const tasteSnapRecord = (D, S, actors) => { const ts = tasteSnapshot(D, S), likes = ((S.prefs || {}).favs || []).filter(a => actors.has(a)).slice(0, 10), labels = D.actorTagLabels || {}, likeTags = {};
  for (const a of likes) { const t = [...new Set(likeTagsFor(S, a))].filter(x => labels[x]).slice(0, 8); if (t.length) likeTags[a] = t; }  // 좋아하는 배우별로 고른 특징 태그(사전 확정 태그만). '왜 좋아요' 글은 안 넣는다
  return {likes, axes: ts.axes, tags: ts.tags, likeTags}; };
// 홈 '비슷한 배우' 줄이 비는 이유가 좋아하는 배우의 특징 없음일 때 묻는 칸: 앞 3명 중 특징 태그가 하나도 없고 아직 안 물어본(건너뛰지 않은) 첫 배우 한 명. 건너뜀·답은 S.likes 의 그 배우 항목에 저장(asked)
const askActorOf = (D, S) => ((S.prefs || {}).favs || []).slice(0, 3).find(a => { const t = traitsOf(D, a, likeTagsFor(S, a)); return !t.voice.length && !t.role.length && !(S.likes || []).some(l => l.actor === a && l.asked); }) || null;
// 묻는 칸의 칩 6~8개: 비교에 쓰는 태그(목소리 6 + 연기·해석 가장 흔한 2), 사전 확정 태그(D.actorTagLabels)만
const askTagList = D => { const lab = D.actorTagLabels || {}, vs = D.voiceTags || VOICE_TAGS, cnt = {};
  for (const p of Object.values(D.actorProfiles || {})) for (const r of p.role || []) if (lab[r.tag] && !vs.includes(r.tag) && !isOfficial(r)) cnt[r.tag] = (cnt[r.tag] || 0) + 1;
  return [...vs.filter(t => lab[t]).slice(0, 6), ...Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a] || a.localeCompare(b, "ko")).slice(0, 2)]; };
// 홈 추천 줄에서 숨긴 공연(S.proto.hid[공연 열쇠] = {a: seen|not_interested, row}): 추천 줄(좋아하는 배우·비슷한 배우·내 취향)에서만 빠진다. '지금 하는 공연 전체'엔 그대로
const hiddenShows = S => S.proto?.hid || {};
const hideShow = (S, key, row, action) => { if (!["seen", "not_interested"].includes(action) || !["fav", "similar", "taste"].includes(row)) return false; ((S.proto ||= {}).hid ||= {})[key] = {a: action, row}; return true; };
const unhideShow = (S, key) => { const e = S.proto?.hid?.[key]; if (!e) return null; delete S.proto.hid[key]; return e; };
const runLabelOf = (D, work, date) => { const rs = (D.works.find(x => x.name === work) || {}).runs || []; return (rs.find(r => date >= r.start && date <= r.end) || rs[0] || {}).label; };
const ratingChips = (rating, only = null) => (rating.chips || []).map(c => { const as = only ? only(c) : c.actors || []; return {chip: c.chip, dir: c.dir, ...(as.length ? {actors: as} : {})}; });  // 배우를 안 골랐으면 actors 는 뺀다
// combo_rating: stage expected(추천 직후, 날짜 없음 — perf 를 안 넘기고 runDate 로 시즌만) / experienced(관람 후, 본 회차 perf)
const comboRecord = (D, S, stage, work, cast, rating, perf = null, runDate = "") => {
  const e = comboEvidence(D, S.prefs?.axes || [], work, cast, wrongOf(S, work)), by = {};
  for (const x of e.ev) if (x.role !== "조합") (by[x.who] ||= new Set()).add(x.tag);
  const rec = {stage, taste: tasteSnapshot(D, S), work, run: runLabelOf(D, work, perf?.date || runDate), cast: Object.fromEntries(leadsOf(D, work, cast)),
    reasons: {actors: Object.fromEntries(Object.entries(by).map(([a, s]) => [a, [...s].slice(0, 8)])), combo: [...new Set(e.ev.filter(x => x.role === "조합").map(x => x.tag))].slice(0, 6)},
    algo: ALGO_VER, score: rating.score, chips: ratingChips(rating)};
  if (!rec.run) delete rec.run;
  if (perf) { rec.date = perf.date; rec.time = perf.time; }
  return rec;
};
// 지금 추천 조합 위 3개(첫째가 화면의 PICK 카드, 나머지는 '다음 추천')
const shownCombos = (D, S, work, from) => comboRecs(D, S, work, from).slice(0, 3).map((c, i) => ({cast: c.cast, pick: i === 0}));
// combo_choice: '볼 예정 담기'(plan)·'예매처로'(ticket)를 누른 회차. 걸어 둔 필터: 이 흐름엔 기간 칩이 없어 period 는 all
const comboChoiceRecord = (D, S, action, p, from) => ({action, work: p.work, run: runLabelOf(D, p.work, p.date), date: p.date, time: p.time, cast: Object.fromEntries(leadsOf(D, p.work, p.cast)),
  shown: shownCombos(D, S, p.work, from), filters: {period: "all", star: pinsOf(S, p.work).star.slice(0, 4), avoid: pinsOf(S, p.work).avoid.slice(0, 4)}});
const roleOfActor = (D, work, a) => ((D.roles[work] || []).find(r => r.weight === "주연" && r.cast.includes(a)) || {}).role;
const pinAction = (before, after) => after === "star" ? "pin" : after === "avoid" ? "avoid" : before === "star" ? "unpin" : "unavoid";
const pickRecord = (D, work, actor, before, after) => ({work, role: roleOfActor(D, work, actor), actor, action: pinAction(before, after)});
// actor_rating: 회차 캐스팅이 없는 공연은 조합이 없어 대표 출연진 배우 단위. '설명이 틀렸어요'는 그 배우 하나라 배우를 따로 안 고른다
const actorRecord = (D, S, show, actor, rating) => ({show_id: show, actor, score: rating.score, chips: ratingChips(rating, c => c.chip === "wrong" ? [actor] : [])});

// ---- '이 조합 어때요? 1~5' + 이유 칩(점수 따라 질문이 바뀐다: 4~5점 '뭐가 끌렸어요?'(+) · 1~2점 '뭐가 안 맞았어요?'(−) · 3점 둘 다). '특정 배우'·'설명이 틀렸어요'는 누르면 배우를 한 번 더 고른다
const chipDirs = score => score >= 4 ? ["+"] : score === 3 ? ["+", "-"] : score >= 1 ? ["-"] : [];
const chipList = (kind, dir) => CHIPS.filter(([c]) => !(kind === "actor" && (c === "chemistry" || c === "actor")) && !(c === "wrong" && dir === "+"));  // 배우 한 명 평가엔 케미·특정 배우가 없고, '설명이 틀렸어요'는 끌린 점 쪽엔 안 둔다
const NEEDS_WHO = ["actor", "wrong"];
const draftScore = (dr, n) => { const score = dr.score === n ? 0 : n, dirs = chipDirs(score); return {score, chips: (dr.chips || []).filter(c => dirs.includes(c.dir))}; };  // 점수가 바뀌어 방향이 안 맞게 된 칩은 비운다
const draftChip = (dr, chip, dir) => { const cs = dr.chips || [], has = cs.some(c => c.chip === chip && c.dir === dir); return {...dr, chips: has ? cs.filter(c => !(c.chip === chip && c.dir === dir)) : [...cs, {chip, dir, actors: []}]}; };
const draftActor = (dr, chip, dir, a) => ({...dr, chips: (dr.chips || []).map(c => c.chip === chip && c.dir === dir ? {...c, actors: c.actors.includes(a) ? c.actors.filter(x => x !== a) : [...c.actors, a].slice(0, 4)} : c)});
// 평가를 화면에 바로 반영한다. 조합: 1~2점이면 그 조합을 추천에서 내리고(다음 조합이 바로 나온다), 4~5점이면 높게 평가한 조합으로 남긴다.
// 칩 '특정 배우': 안 맞은 점(−)이면 '제외할까요?', 끌린 점(+)이면 '꼭 볼 배우로 할까요?'를 평가 뒤에 물어서 답할 때만 🚫/⭐ 를 건다(자동으로 안 건다). '설명이 틀렸어요': 고른 배우(안 골랐으면 조합 전체)의 태그 근거를 이 작품 추천에서 뺀다
const applyComboRating = (S, work, key, rating, cast = {}) => {
  const P = (S.proto ||= {}); (P.rate ||= {})[work + "|" + key] = {score: rating.score, chips: ratingChips(rating)};
  const eff = {hid: false, liked: false, ask: [], wrong: []};
  if (rating.score <= 2) { (P.hide ||= {})[work] = [...new Set([...(P.hide[work] || []), key])]; eff.hid = true; }
  if (rating.score >= 4) eff.liked = true;
  for (const c of rating.chips || []) {
    if (c.chip === "actor") for (const a of c.actors || []) {  // ⭐/🚫 는 자동으로 걸지 않는다(그 배우가 나오는 회차가 통째로 빠지거나 몰리니까). 평가 뒤에 묻는다
      const kind = c.dir === "-" ? "avoid" : "star";
      if (pinStateOf(S, work, a) !== kind) { eff.ask = eff.ask.filter(x => x.actor !== a); eff.ask.push({actor: a, kind}); }
    }
    if (c.chip === "wrong") { const as = (c.actors || []).length ? c.actors : Object.values(cast); (P.wrong ||= {})[work] = [...new Set([...(P.wrong[work] || []), ...as])]; eff.wrong.push(...as); }
  }
  if (eff.ask.length) { const cur = (P.pinAsk ||= {})[work] || []; P.pinAsk[work] = [...cur.filter(x => !eff.ask.some(y => y.actor === x.actor)), ...eff.ask]; }
  return eff;
};
// 평가 뒤 '○○ 제외할까요? / 꼭 볼 배우로 할까요?': 대기 중인 물음, 답하기(yes 면 그때만 ⭐/🚫 를 건다. 건 뒤 상태를 돌려준다)
const pinAskOf = (S, work) => S.proto?.pinAsk?.[work] || [];
const setPin = (S, work, actor, kind) => {
  const P = ((S.proto ||= {}).pins ||= {})[work] ||= {star: [], avoid: []}, other = kind === "star" ? "avoid" : "star";
  P[other] = P[other].filter(a => a !== actor); if (!P[kind].includes(actor)) P[kind].push(actor);
  return kind;
};
const answerPinAsk = (S, work, actor, yes) => {
  const q = pinAskOf(S, work).find(x => x.actor === actor); if (!q) return null;
  S.proto.pinAsk[work] = S.proto.pinAsk[work].filter(x => x.actor !== actor);

// 배우(회차 없는 공연): 1~2점(또는 '설명이 틀렸어요')이면 닮은 배우 기준에서 빼고, 4~5점이면 좋아하는 배우로 더한다
const applyActorRating = (S, show, actor, rating) => {
  const P = (S.proto ||= {}); (P.arate ||= {})[show + "|" + actor] = {score: rating.score, chips: ratingChips(rating)};
  const eff = {avoid: false, fav: false}, wrong = (rating.chips || []).some(c => c.chip === "wrong");
  if (rating.score >= 4) { const pr = (S.prefs ||= {axes: [], grade: "", favs: [], works: []}); pr.favs ||= []; P.avoidActors = (P.avoidActors || []).filter(a => a !== actor); if (!pr.favs.includes(actor)) { pr.favs.push(actor); eff.fav = true; } }
  else if (rating.score <= 2 || wrong) { P.avoidActors = [...new Set([...(P.avoidActors || []), actor])]; eff.avoid = true; }
  return eff;
};

// ---- 배역별 이상형 월드컵(극 요약 아래, 선택): 같은 배역의 두 배우를 보여 주고 왼쪽/비슷해요/오른쪽. 한 라운드 = 주연 배역마다 1판, 최대 DUEL_MAX(3)판(10초). 끝에 '더 해 볼래요'로 다음 라운드. 고른 결과는 그 작품의 추천 조합에 바로 반영된다(comboRecs 의 duelBonus)
const DUEL_MAX = 3;
const duelCands = (D, work, role, from) => { const has = new Set(D.perfs.filter(p => p.work === work && p.date >= from && !isPrivate(p)).map(p => p.cast[role]).filter(Boolean)); return ((D.roles[work] || []).find(r => r.role === role)?.cast || []).filter(a => has.has(a)); };
const duelDone = (S, work) => duelsOf(S, work).length;
const duelTags = (D, work, a, role) => [...new Set(roleRows(D, work, a, role).map(r => r.tag))].slice(0, 6);  // 화면에 보여 주는 태그 = 기록에 남는 태그
const duelRound = (S, work) => S.proto?.duelRound?.[work] || 1;
// 배역별 현황: 후보·이미 한 판·할 수 있는 쌍 수(total)·이번까지 할 판 수(cap = min(라운드 수, total)). 배역이 많아도 앞의 DUEL_MAX 개만
const duelStatus = (D, S, work, from) => (D.roles[work] || []).filter(r => r.weight === "주연").slice(0, DUEL_MAX).map(r => {
  const c = duelCands(D, work, r.role, from), v = duelsOf(S, work).filter(d => d.role === r.role), total = c.length * (c.length - 1) / 2;
  return {role: r.role, cands: c, voted: v, total, cap: Math.min(duelRound(S, work), total)}; });
const duelCanMore = (D, S, work, from) => duelStatus(D, S, work, from).some(x => x.voted.length < x.total);
const duelMore = (S, work) => { const P = (S.proto ||= {}); (P.duelRound ||= {})[work] = duelRound(S, work) + 1; if (P.duelCur) delete P.duelCur[work]; };
// 지금 할 판: 이미 놓인 판(좌우는 한 번 무작위로 정해 두고 다시 그려도 안 바뀐다)이 아직 유효하면 그대로, 아니면 이번 라운드에 덜 한 배역(판 수가 적은 순, 같으면 배역 순)에서 덜 나온 배우끼리. n=이번까지 한 판 수, of=이번까지 할 판 수
const duelNext = (D, S, work, from, rng = Math.random) => {
  const P = (S.proto ||= {}), st = duelStatus(D, S, work, from), of = st.reduce((n, x) => n + x.cap, 0), n = st.reduce((k, x) => k + Math.min(x.voted.length, x.cap), 0);
  const pairVoted = (v, a, b) => v.some(d => (d.left === a && d.right === b) || (d.left === b && d.right === a)), cur = (P.duelCur ||= {})[work];
  if (cur) { const x = st.find(y => y.role === cur.role);
    if (x && x.voted.length < x.cap && x.cands.includes(cur.left) && x.cands.includes(cur.right) && !pairVoted(x.voted, cur.left, cur.right)) return {...cur, n, of};
    delete P.duelCur[work]; }
  const x = st.filter(y => y.voted.length < y.cap).sort((a, b) => a.voted.length - b.voted.length)[0];
  if (!x) return null;
  const seen = a => x.voted.filter(d => d.left === a || d.right === a).length, pairs = [];
  for (let i = 0; i < x.cands.length; i++) for (let j = i + 1; j < x.cands.length; j++) if (!pairVoted(x.voted, x.cands[i], x.cands[j])) pairs.push([x.cands[i], x.cands[j]]);
  if (!pairs.length) return null;
  pairs.sort((p, q) => seen(p[0]) + seen(p[1]) - seen(q[0]) - seen(q[1]));
  let [a, b] = pairs[0]; if (rng() < 0.5) [a, b] = [b, a];
  P.duelCur[work] = {role: x.role, left: a, right: b};
  return {...P.duelCur[work], n, of};
};
const duelRecord = (D, work, cur, result) => ({work, role: cur.role, left: {actor: cur.left, tags: duelTags(D, work, cur.left, cur.role)}, right: {actor: cur.right, tags: duelTags(D, work, cur.right, cur.role)}, result});
const applyDuel = (S, work, cur, result) => {
  const P = (S.proto ||= {}), win = result === "left" ? cur.left : result === "right" ? cur.right : "", lose = result === "left" ? cur.right : result === "right" ? cur.left : "";
  (P.duels ||= []).push({work, role: cur.role, left: cur.left, right: cur.right, result, win, lose});
  if (P.duels.length > 100) P.duels.shift();
  if (P.duelCur) delete P.duelCur[work];
  return {win, lose};
};

// ---- 관람 후: '볼 예정'에 담은 공연 날짜가 지났고 아직 안 물었으면 한 번만 묻는다(본 조합 1~5 + 같은 이유 칩 → 또 보고 싶은 배우는 선택). 답하거나 건너뛰면 asked 로 닫힌다
const dueVisit = (S, from) => (S.plans || []).findIndex(x => x.date < from && !x.asked && !x.tagged);
const answerVisit = (S, i, rating, at = "") => {
  const x = (S.plans || [])[i]; if (!x) return null;
  x.asked = true; x.tagged = true; x.again = []; x.rating = {score: rating.score, chips: ratingChips(rating)};
  x.mood = rating.score >= 4 ? "good" : rating.score === 3 ? "meh" : "bad";
  S.tags.push({at, work: x.work, date: x.date, time: x.time, mood: x.mood, role: "", actor: "", tags: [], partner: "", combo: [], score: rating.score, seat: "", view: 0, note: "", check: {}});  // 점수 한 번이면 관람 기록이 된다(추천 가중치에 반영)
  return x;
};
const skipVisit = (S, i) => { const x = (S.plans || [])[i]; if (x) x.asked = true; return x; };  // '나중에': 다시 묻지 않는다(기록은 안 남는다)
const addAgain = (S, i, again) => {  // 또 보고 싶은 배우는 좋아하는 배우(취향 예시)로 들어간다
  const x = (S.plans || [])[i]; if (!x) return null;
  x.again = again.slice(0, 3);
  const P = (S.prefs ||= {axes: [], grade: "", favs: [], works: []}); P.favs ||= [];
  for (const a of x.again) if (!P.favs.includes(a)) P.favs.push(a);
  return x;
};

// ---------- 기록 배선 (docs/data_spec_combo_fit_2026-10-10.md 6종) ----------
// 목적: 추천한 조합이 그 사람 취향에 맞았는지 배우는 데이터. 사용 지표(앱 열기 등)는 만들지 않는다. 가입 없이 무작위 익명 ID 로만.
// 지금은 연습 모드라 서버로 안 보내고 콘솔과 화면 구석 목록에만 보인다. 켜는 법: 내보내기(recommend.py --export)가 .env 의 SUPABASE_URL·SUPABASE_ANON_KEY(공개 키만)를 data.js 의 window.PICKLE_TRACK 으로 넣는다. 키는 이 파일에 적지 않는다
// <track>
const TRACK_CFG = {mode: "practice", url: "", key: "", table: "events", batch: 20, cap: 200, maxBytes: 4096, keepaliveBytes: 56000};  // keepalive 요청 본문은 64KB 까지라 한 번에 56KB 넘게 묶지 않는다
const ALGO_VER = "rule-v1";  // 추천 방식 버전: 추천 규칙이 바뀌면 올린다(어느 방식이 낸 추천을 평가한 건지 구분)
const APP_VER = "proto-0.3";  // 서버 표 제약: 20자 이하
// 이유 칩 7개(정의서). 코드 ↔ 화면 글자. 글자가 바뀌어도 기록 값(코드)은 그대로다
const CHIPS = [["voice", "목소리"], ["vocal", "성량·가창"], ["acting", "연기·해석"], ["chemistry", "두 배우 호흡"], ["actor", "특정 배우"], ["wrong", "설명이 틀렸어요"], ["etc", "날짜·가격·이미 봄"]];
const CHIP_CODES = CHIPS.map(c => c[0]);
const PERIOD_CODES = ["weekend", "2w", "month", "next", "all"];

const RATE_CTX = {};
const ratingBox = ctx => {  // ctx.bare: 카드·제목 없이 별·칩만(시트 안)
  const rid = "r" + Object.keys(RATE_CTX).length; RATE_CTX[rid] = ctx;
  const dr = S.proto?.dr?.[ctx.key] || {score: 0, chips: []}, sent = S.proto?.sent?.[ctx.key], dirs = chipDirs(dr.score), single = ctx.kind === "actor";
  const wrap = inner => ctx.bare ? `<div class="fbbare">${inner}</div>` : `<div class="card fb"><h3>${esc(ctx.title)} <span class="small muted">1~5점 · 선택</span></h3>${inner}</div>`;
  if (sent) return `<div class="card fb"><h3>${esc(ctx.title)}</h3><p class="small fbmsg">${esc(S.proto?.msg?.[ctx.key] || "기록했어요.")}</p><button class="chip x" data-act="rateAgain" data-id="${rid}">다시 평가하기</button></div>`;
  const section = dir => {
    const list = chipList(ctx.kind, dir), pick = c => dr.chips.find(x => x.chip === c && x.dir === dir);
    const q = dirs.length === 2 ? (dir === "+" ? "끌린 점이 있나요?" : "안 맞은 점이 있나요?") : dir === "+" ? "뭐가 끌렸어요?" : "뭐가 안 맞았어요?";
    const who = single ? "" : list.filter(([c]) => NEEDS_WHO.includes(c) && pick(c)).map(([c]) => `<p class="tiny muted">${c === "wrong" ? "어느 배우의 설명이 틀렸나요?" : "누구인가요?"} <span>(안 고르면 조합 전체)</span></p><div class="chips">${ctx.actors.map(a => `<button class="chip x ${pick(c).actors.includes(a) ? "on" : ""}" data-act="rateActor" data-id="${rid}" data-c="${c}" data-d="${dir}" data-a="${esc(a)}">${esc(a)}</button>`).join("")}</div>`).join("");
    return `<div class="chsec"><p class="tiny muted">${q} <span>여러 개 · 선택</span></p><div class="chips">${list.map(([c, l]) => `<button class="chip x ${pick(c) ? "on" : ""}" data-act="rateChip" data-id="${rid}" data-c="${c}" data-d="${dir}">${esc(l)}</button>`).join("")}</div>${who}</div>`;
  };

  const stars = `<div class="stars" role="group" aria-label="점수 1~5">${[1, 2, 3, 4, 5].map(n => `<button type="button" class="star ${n <= dr.score ? "on" : ""}" data-act="rateScore" data-id="${rid}" data-n="${n}" aria-label="${n}점" aria-pressed="${n === dr.score}">★</button>`).join("")}</div>
    <div class="starends"><span>${esc(ctx.lo || (ctx.kind === "after" ? "별로였어요" : "안 맞아요"))}</span><span>${esc(ctx.hi || (ctx.kind === "after" ? "아주 좋았어요" : "딱 맞아요"))}</span></div>`;

// 평가를 보낸 뒤 화면에 보여 줄 한 줄(무엇을 바꿨는지)
const eun = name => { const c = String(name).charCodeAt(String(name).length - 1) - 0xAC00; return c >= 0 && c % 28 ? "은" : "는"; };
const rateMessage = (ctx, eff) => {
  const rec = TRK.isOff() ? "반영했어요." : "기록했어요.";  // 기록을 끄면 아무것도 안 쌓이고 이 화면에만 반영된다
  if (ctx.kind === "combo") {
    const parts = [rec];
    if (eff.hid) parts.push("이 조합은 추천에서 내렸어요. 다음 조합을 바로 보여 드려요.");
    else if (eff.liked) parts.push("이 조합을 좋게 기억했어요.");
    if (eff.wrong.length) parts.push(`설명이 틀렸다고 한 배우(${[...new Set(eff.wrong)].join("·")})의 태그 근거는 이 작품 추천에서 뺐어요.`);
    return parts.join(" ");
  }
  if (ctx.kind === "actor") return eff.avoid ? `${rec} 이 배우는 닮은 배우 추천에서 빼 둘게요.` : eff.fav ? `${rec} ${ctx.actor}${eul(ctx.actor)} 좋아하는 배우에 더했어요 — 닮은 배우가 나오는 공연을 추천에 더해요.` : rec;
  return rec;

// ---------- proto: 홈 한 화면 = 내 취향 추천 극 + 지금 하는 공연 전체 ----------

// 숨긴 공연 N개 · 되돌리기(추천 줄 아래): 목록을 펼쳐서 하나씩 되돌린다
const hiddenList = () => { const items = Object.entries(hiddenShows(S)).map(([key, e]) => ({key, e, ref: showRef(D, key)})).filter(x => x.ref); if (!items.length) return "";

const listCard = x => { const ref = showRef(D, x.key); if (!ref) return "";  // 포스터 격자: 포스터와 제목만(+ 캐스팅 일정 표시)
  return `<a class="pcard" href="#show/${esc(x.key)}" data-go="#show/${esc(x.key)}" data-entry="browse"><div class="pimg">${posterOf(ref, "pi")}${castMark(ref)}</div><span class="pt">${esc(x.title)}</span></a>`; };
// 관람 후(한 번만): ① 본 조합 1~5 + 이유 칩(experienced 평가) → ② 또 보고 싶은 배우(선택). 긴 후기는 선택(3초 기록 화면)
const visitCard = i => { const x = S.plans[i], vd = S.proto?.vd?.i === i ? S.proto.vd : null, ls = leadsOf(D, x.work, x.cast), head = `${esc(x.work)} · ${md(x.date)} 공연`;

V.home = () => {
  const from = today(), p = S.prefs, taste = hasTaste(p), rows = homeRows(D, S, from);

    ? (`${rows.A.length ? `<section class="hsec"><h2>좋아하는 배우가 나와요</h2><p class="hsub">지금 하는 공연 중에서 좋아하는 배우가 출연하는 공연이에요</p>${row(rows.A, "fav")}</section>` : ""}
      ${rows.B.length ? `<section class="hsec"><h2>좋아하는 배우와 비슷한 배우가 나와요</h2><p class="hsub">좋아하는 배우가 안 나와도, 목소리 특징이 비슷한 배우가 나오는 공연이에요</p>${row(rows.B, "similar")}</section>` : ""}

      ${rows.A.length || rows.B.length || rows.taste.length || askActorOf(D, S) ? "" : `<section class="hsec">${emptyCard("지금 하는 공연 중에 좋아하는 배우나 비슷한 배우가 나오는 공연이 아직 없어요. 아래 전체에서 찾아보세요.", "#taste/3")}</section>`}`)
    : `<section class="hsec"><h2>내 취향 추천</h2>${rows.mode === "taste" ? row(rows.taste, "taste")
      : !taste ? `<div class="card accent"><h3>취향을 고르면 추천해 드려요</h3><p class="small muted">아직 취향을 안 골랐어요. 아래에서 지금 하는 공연 전체를 볼 수 있어요.</p><button class="btn" data-go="#taste/1">취향 고르기</button></div>`
      : emptyCard("아직 근거가 있는 추천이 없어요. 좋아하는 배우나 끌리는 공연을 더 고르면 이유와 함께 보여 드려요.", "#taste/1")}</section>`;
  // 지금 하는 공연 전체: 인기순 한 줄 목록. 지역 칩 [전체 N][공연 많은 지역 …][그 외 지역] — 칩 안 목록도 인기순
  const tabs = regionTabs(all), tab = tabs.some(([k]) => k === S.proto?.areaTab) ? S.proto.areaTab : "all";
  const allHtml = `<div class="pgrid">${showsIn(all, tabs, tab, from).map(listCard).join("")}</div>`;
  return `${noticeLine()}
  ${due >= 0 && S.plans[due] ? visitCard(due) : ""}
  <div class="browse-head"><p class="eyebrow">다음 뮤지컬 찾기</p><h1>내 취향에 닿는 무대를<br>발견해 보세요.</h1><p class="browse-lead">공연과 배우, 끌리는 이유부터 살펴보세요.</p></div>
  ${taste ? `<p class="muted small">내 취향: ${esc(mine.join(" · ") || "선택한 항목 없음")} <a href="#taste/1">취향 다시 고르기</a></p>` : ""}

};

const workTagsOf = ref => (D.workTags || {})[ref.kind === "seed" ? ref.key : ref.s.title] || [];  // 시드 작품은 작품 이름, KOPIS 공연은 공연 제목이 태그 열쇠
