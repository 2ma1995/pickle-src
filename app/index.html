      S.proto.duelMsg = {work: dwork, text: r.win ? `${r.win} 쪽을 골랐어요. 위 추천 조합에 반영했어요.` : "비슷하다고 기록했어요."};
      save(); route(); break; }
    case "pinAnswer": { const before = pinStateOf(S, d.work, d.a), after = answerPinAsk(S, d.work, d.a, d.y === "1"); if (after) track("actor_pick", pickRecord(D, d.work, d.a, before, after)); save(); refresh(); break; }  // '제외할까요?'·'꼭 볼 배우로 할까요?' 에 답했을 때만 🚫/⭐
    case "duelMore": duelMore(S, d.work || work); save(); route(); break;  // 월드컵 다음 라운드
    case "selActor": { const before = setSel(D, S, d.work, d.role, d.a, today()); save(); route(); break; }  // 그 배역의 배우를 바꾼다: 아래 날짜가 다시 계산된다
    case "selCombo": { const c = comboRecs(D, S, d.work, today())[+d.i]; if (!c) return; setSelCast(S, d.work, c.cast); save(); route(); break; }
    case "calDay": { ((S.proto ||= {}).cd ||= {})[d.work] = d.d; save(); route(); break; }
    case "calMove": { calMove(S, d.work, selDates(D, d.work, curSel(D, S, d.work, today()), today()), +d.d); save(); route(); break; }
    case "toDates": { const t = document.querySelector("#dates"); if (t) t.scrollIntoView({behavior: "smooth"}); break; }
    case "cmpOpen": { const c = S.proto?.cmp?.[d.work]; if (!c) return; const flip = Math.random() < 0.5; SHEET = {kind: "duel", work: d.work, cur: {role: c.role, left: flip ? c.b : c.a, right: flip ? c.a : c.b}}; renderSheet(); break; }  // 좌우는 무작위
    case "sheetDuel": { if (SHEET?.kind !== "duel") return; const {work: w, cur} = SHEET; track("role_duel", duelRecord(D, w, cur, d.r)); const r = applyDuel(S, w, cur, d.r); delete (S.proto.cmp || {})[w]; save(); closeSheet(); route(); toast(r.win ? `${r.win} 쪽을 골랐어요. 추천 조합에 반영했어요` : "비슷하다고 기록했어요"); break; }
    case "sheetSkip": if (SHEET?.kind === "rate") finishPending(); break;  // 나중에: 점수 없이 계속
    case "sheetGo": if (SHEET?.kind === "rate") finishPending(); break;
    case "sheetOther": { if (SHEET?.kind !== "rate") return; const w = SHEET.pending.work, P = S.proto; if (P?.sel) delete P.sel[w]; for (const k of ["cm", "cd", "cmp"]) if (P?.[k]) delete P[k][w]; save(); closeSheet(); SCROLL_TO = "#cast"; route(); break; }  // 내려간 조합 대신 다음 추천 조합이 미리 선택된다
    case "visitSkip": skipVisit(S, +d.i); save(); route(); break;
    case "visitAgain": { const vd = S.proto?.vd; if (!vd) return; vd.again = vd.again.includes(d.a) ? vd.again.filter(a => a !== d.a) : [...vd.again, d.a].slice(0, 3); save(); route(); break; }
    case "visitDone": { const vd = S.proto?.vd; if (!vd) return; addAgain(S, vd.i, vd.again); delete S.proto.vd; save(); route(); toast(vd.again.length ? "좋아하는 배우에 더했어요" : "저장했어요"); break; }
    case "trackToggle": TRK.setOff(!TRK.isOff()); CLR_ASK = false; renderDebug(); route(); toast(TRK.isOff() ? "기록을 껐어요" : "기록을 켰어요"); break;
    case "trackClear": TRK.clearDevice(); CLR_ASK = true; renderDebug(); route(); toast("이 기기 기록을 지웠어요"); break;
    case "clearAppData": { CLR_ASK = false; try { localStorage.removeItem(KEY); } catch (e) {} location.hash = "#taste/1"; location.reload(); break; }  // 취향·볼 예정(앱 사용 데이터)은 따로 물어서만 지운다
    case "clearAppKeep": CLR_ASK = false; route(); break;
    case "dbgToggle": DBG_OPEN = !DBG_OPEN; renderDebug(); break;
    case "areaTab": { if (regionTabs(allShows(D, today())).some(([k]) => k === d.t)) { (S.proto ||= {}).areaTab = d.t; save(); route(); } break; }  // 홈 전체 목록의 구분 버튼
    case "themeToggle": setTheme(themeNow() === "dark" ? "light" : "dark"); break;  // 정합도 데이터가 아니라서 track 에 남기지 않는다
    case "addFav": { const v = $("#fav").value.trim(), P = prefsOf(); if (!v) return; if (P.avoid) P.avoid = P.avoid.filter(a => a !== v); if (!P.favs.includes(v)) { P.favs.push(v); likeOpen.add(v); if (!knownActor(D, v)) noteRequest(v); } save(); route(); $("#fav")?.focus(); break; }
    case "likeAsk": likeOpen.add(d.a); location.hash = "#me"; setTimeout(() => [...document.querySelectorAll(".likebox")].find(x => x.dataset.a === d.a)?.scrollIntoView(), 60); break;  // 홈의 '어떤 점이 좋아요?' → 내 취향의 그 배우 입력 칸을 열어 둔다
    case "rmFav": { const P = prefsOf(); P.favs = P.favs.filter(a => a !== d.a); if (P.must) P.must = P.must.filter(a => a !== d.a); save(); route(); break; }
    case "setGrade": { const P = prefsOf(); P.grade = P.grade === d.g ? "" : d.g; save(); route(); break; }
    case "toggleActor": { const st = (S.cal[d.work || work] ||= {actors: [], period: "all"}); st.actors = st.actors.includes(d.a) ? st.actors.filter(a => a !== d.a) : [...st.actors, d.a]; save(); route(); break; }
    case "clearActors": S.cal[d.work || work].actors = []; save(); route(); break;
    case "toggleAvoid": {  // 제외는 보고 싶은 배우와 동시에 될 수 없다. 다시 누르면 풀림
      const st = (S.cal[d.work || work] ||= {actors: [], period: "all"}), av = st.avoid || [];
      st.avoid = av.includes(d.a) ? av.filter(a => a !== d.a) : [...av, d.a]; st.actors = st.actors.filter(a => a !== d.a);
      save(); route(); break; }
    case "period": S.cal[work].period = d.p; save(); route(); break;
    case "rAxis": {  // 작품별 취향 칩. 짝(노래↔연기 등)은 하나만
      const st = S.cal[d.work], P = Object.fromEntries(D.axes.flatMap(a => [[a.left, a.right], [a.right, a.left]]));  // 짝은 사전·설문 축 5쌍에서
      st.axes = !d.v ? [] : st.axes.includes(d.v) ? st.axes.filter(x => x !== d.v) : [...st.axes.filter(x => x !== P[d.v]), d.v];
      st.edited = true; save(); route(); break; }  // 이 작품에서 직접 바꿨다: 이제 기본 취향이 바뀌어도 따라가지 않는다
    case "rAxisReset": S.cal[d.work].edited = false; followBase(S.cal[d.work], S.prefs?.axes || []); save(); route(); break;  // 기본 취향을 다시 따른다
    case "run": S.cal[work].run = d.r; save(); route(); break;
    case "dropActor": { const w = d.work || work; S.cal[w].actors = S.cal[w].actors.filter(a => a !== d.a); save(); route(); break; }
    case "peek": { (S.cal[d.work || work] ||= {actors: [], period: "all"}).peek = d.d; save(); route(); break; }
    case "pinDate": { const st = (S.cal[d.work || work] ||= {actors: [], period: "all"}); st.dates = (st.dates || []).includes(d.d) ? st.dates.filter(x => x !== d.d) : [...(st.dates || []), d.d].sort(); st.peek = d.d; if (S.query?.work === (d.work || work)) S.query.dates = st.dates; save(); route(); break; }
    case "runAll": { const st = S.cal[d.work]; st.dates = []; save(); location.hash = "#when/" + d.work; break; }  // 달력에서 날짜를 안 고르면 '언제' 목록으로
    case "whenF": { const st = S.cal[d.work], f = (st.f ||= {}); f[d.k] = !f[d.k]; if (d.k === "day" && f.day) f.eve = false; if (d.k === "eve" && f.eve) f.day = false; save(); route(); break; }
    case "whenClear": S.cal[d.work].f = {}; save(); route(); break;
    case "unpinDate": { const st = S.cal[d.work || work]; st.dates = (st.dates || []).filter(x => x !== d.d); if (S.query?.work === (d.work || work)) S.query.dates = st.dates; save(); route(); break; }
    case "clearDates": { const st = S.cal[d.work || work]; st.dates = []; if (S.query?.work === (d.work || work)) S.query.dates = []; save(); route(); break; }
    case "toSide": $("#view .side").scrollIntoView(); break;
    case "closeSheet": closeSheet(); break;
    case "runQuery": { const st = S.cal[d.work]; if (!st?.count) { toast("조건에 맞는 회차가 없어요"); return; } S.query = {work: d.work, lo: st.lo, hi: st.hi, actors: st.actors, dates: st.dates || []}; save(); location.hash = "#result"; break; }
    case "plan": { const p = D.perfs.find(x => x.work === d.work && x.date === d.date && x.time === d.time); if (!p) return; if (isPrivate(p)) { toast("단체 대관 공연이라 일반 예매가 안 돼요"); return; } openRate("plan", p); break; }  // 바로 담지 않고 점수 시트를 거친다(건너뛰면 그때 담는다)
    case "unplan": S.plans.splice(+d.i, 1); save(); route(); break;
    case "plansTab": S.plansTab = d.t; save(); route(); break;
    case "tQuick": { const x = S.plans[+d.i]; x.quick = x.quick === d.q ? "" : d.q; save(); route(); break; }  // 저장 확인 화면의 좋아요/아쉬워요. 다시 누르면 해제
    case "toggleNoPersonal": S.noPersonal = !S.noPersonal; save(); route(); break;  // 내 취향 화면의 '기록 반영 끄기/켜기'
    case "likeTag": { const l = likeGet(d.a), arr = +d.ri < 0 ? l.tags : l.roles[+d.ri].tags; const k = arr.indexOf(d.t); if (k < 0) arr.push(d.t); else arr.splice(k, 1); likeOpen.add(d.a); save(); route(); break; }  // 후보 칩: 누른 것만 저장, 다시 누르면 해제
    case "likeRoleAdd": likeGet(d.a).roles.push({work: "", role: "", why: "", tags: []}); likeOpen.add(d.a); save(); route(); break;
    case "likeRoleDel": likeGet(d.a).roles.splice(+d.ri, 1); likeOpen.add(d.a); save(); route(); break;
    case "tMood": draft.mood = draft.mood === d.m ? "" : d.m; route(); break;
    case "tCheck": { const c = (draft.check ||= {}); if (c[d.k] === d.v) delete c[d.k]; else c[d.k] = d.v; route(); break; }  // 추천 이유 확인. 다시 누르면 해제(안 누른 상태 = 답 없음)
    case "tActor": { const off = draft.actor === d.a; draft.actor = off ? "" : d.a; draft.role = off ? "" : d.r; draft.tags = []; draft.cmp = {}; draft.combo = []; route(); break; }  // 다시 누르면 해제(안 고른 상태로)
    case "tCmp": (draft.cmp ||= {})[d.b] = d.v; route(); break;
    case "tTag": draft.tags = draft.tags.includes(d.t) ? draft.tags.filter(x => x !== d.t) : [...draft.tags, d.t].slice(0, 3); route(); break;
    case "tPartner": draft.partner = d.a; route(); break;
    case "tCombo": draft.combo = draft.combo.includes(d.t) ? draft.combo.filter(x => x !== d.t) : [...draft.combo, d.t]; route(); break;
    case "tScore": draft.score = +d.n; route(); break;
    case "tView": draft.view = +d.n; route(); break;
    case "tSave": { const x = S.plans[draft.i];
      S.tags.push({at: today(), work: x.work, date: x.date, time: x.time, mood: draft.mood || "", role: draft.role, actor: draft.actor, tags: draft.tags, partner: draft.combo.length ? draft.partner : "", combo: draft.combo, score: draft.score, seat: $("#seat").value.trim(), view: draft.view || 0, note: $("#note").value.trim(), check: {...(draft.check || {})}});
      for (const [b, v] of Object.entries(draft.cmp || {})) if (v !== "skip") S.votes.push({at: today(), work: x.work, date: x.date, time: x.time, role: draft.role, a: draft.actor, b, result: v});
      x.tagged = true; S.draft = null; save(); mergeMyTags(); location.hash = "#me"; toast(draft.tags.length ? "저장했어요. 다음 추천에 반영돼요" : "저장했어요"); break; }
    case "copyTsv": { const text = exportRows().map(r => r.join("\t")).join("\n");
      (navigator.clipboard?.writeText(text) || Promise.reject()).then(() => toast("복사했어요"), () => { const r = document.createRange(); r.selectNodeContents($("pre")); getSelection().removeAllRanges(); getSelection().addRange(r); toast("드래그된 글을 복사하세요"); }); break; }
  }
});
document.addEventListener("input", e => { if (S.draft && (e.target.id === "note" || e.target.id === "seat")) S.draft[e.target.id] = e.target.value; });
// 좋아하는 배우 설문: 글을 쓰는 동안 저장하고, 그 칸의 태그 후보 칩만 다시 그린다(화면 전체를 다시 그리지 않아 커서가 안 튄다)
document.addEventListener("input", e => {
  const el = e.target.closest("[data-like]"); if (!el) return;
  const l = likeGet(el.dataset.a), ri = el.dataset.ri === undefined ? -1 : +el.dataset.ri, kind = el.dataset.like, r = ri >= 0 ? l.roles[ri] : null;
  if (kind === "why") l.why = el.value; else if (r) r[kind === "rwhy" ? "why" : kind] = el.value;
  likeOpen.add(el.dataset.a); save();
  const box = el.closest(".likebox").querySelector(`[data-sg="${ri}"]`);
  if (box && (kind === "why" || kind === "rwhy")) box.innerHTML = lkChips(kind === "why" ? l.why : r.why, kind === "why" ? l.tags : r.tags, el.dataset.a, ri);
});
document.addEventListener("keydown", e => {  // 시트(모달)가 열려 있을 때: Esc 로 닫고, Tab 은 시트 안에서만 돈다
  if (!SHEET) return;
  if (e.key === "Escape") { e.preventDefault(); closeSheet(); return; }
  if (e.key !== "Tab") return;
  const f = [...$("#sheet").querySelectorAll('button:not([disabled]),a[href],[tabindex]:not([tabindex="-1"])')], on = document.activeElement;
  if (!f.length) { e.preventDefault(); return; }
  if (e.shiftKey && (on === f[0] || on === $("#sheet"))) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && on === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && ["fav", "avoidIn"].includes(e.target.id)) { e.preventDefault(); $(`[data-act=${e.target.id === "fav" ? "addFav" : "addAvoid"}]`).click(); } });
if (!location.hash) history.replaceState(null, "", entryRoute(S.prefs, S));  // 처음 온 사람(취향 없음)의 첫 화면은 3단계 취향. #pick/… 같은 주소로 바로 들어온 사람은 그대로 둔다
route();
renderDebug();
</script>
