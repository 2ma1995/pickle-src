const MOODS = {good: "좋았어요", meh: "그저 그랬어요", bad: "아쉬웠어요"};
const MOOD_UI = {good: ["😊", "여운이 길게 남아요"], meh: ["😐", "평이한 편이에요"], bad: ["🙁", "기대와 달랐어요"]};  // 관람 후 기분. 한 번만 눌러도 저장할 수 있게 3지선다

// 캘린더 파일(.ics)을 의존성 없이 data: URL로 만든다. DTSTART는 시간대 없는 로컬 시각이라 보는 사람 기기의 시간대로 들어간다. 길이는 2시간 30분으로 고정.
// ponytail: 공연마다 러닝타임이 다르다. 데이터에 러닝타임이 생기면 그 값으로
function icsHref(x, run) {
  const p2 = n => String(n).padStart(2, "0");
  const loc = d => fmt(d).replace(/-/g, "") + "T" + p2(d.getHours()) + p2(d.getMinutes()) + "00";
  const start = new Date(`${x.date}T${x.time}:00`), end = new Date(start.getTime() + 150 * 60000), u = new Date();
  const stamp = `${u.getUTCFullYear()}${p2(u.getUTCMonth() + 1)}${p2(u.getUTCDate())}T${p2(u.getUTCHours())}${p2(u.getUTCMinutes())}${p2(u.getUTCSeconds())}Z`;
  const e = s => String(s).replace(/[\\;,]/g, "\\$&").replace(/\r?\n/g, "\\n");
  const who = leads(x.work, x.cast).map(([, a]) => a).join("·");
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//PICKLE//KO", "CALSCALE:GREGORIAN", "BEGIN:VEVENT",
    `UID:pickle-${x.date}-${x.time.replace(":", "")}-${x.work.replace(/\s+/g, "")}@pickle`, `DTSTAMP:${stamp}`, `DTSTART:${loc(start)}`, `DTEND:${loc(end)}`,
    `SUMMARY:${e(who ? `${x.work} (${who})` : x.work)}`, ...(run?.venue ? [`LOCATION:${e(run.venue)}`] : []), "END:VEVENT", "END:VCALENDAR"].join("\r\n") + "\r\n";
  return "data:text/calendar;charset=utf-8," + encodeURIComponent(ics);
}

V.plans = () => {
  const card = (x, i) => `<div class="card">
      <div class="between"><b>${esc(x.work)}</b><span class="small muted">${md(x.date)}(${esc(x.dow)}) ${esc(x.time)}</span></div>
      <div class="chips">${castChips(x.work, x.cast)}</div>

      <button class="chip x" data-act="unplan" data-i="${i}">삭제</button></div>`;
  const items = S.plans.map((x, i) => [x, i]), up = items.filter(([x]) => !isSeen(x)), done = items.filter(([x]) => isSeen(x));
  const works = [...new Set(done.map(([x]) => x.work))];
  const progress = works.map(work => {
    const all = new Set(perfsOf(work).map(p => leadKey(work, p.cast))), seen = [...seenKeys(work)].filter(k => all.has(k)).length;
    return `<div class="card"><div class="between"><b>${esc(work)}</b><span class="small muted">본 조합 ${seen}개 / 전체 ${all.size}개</span></div>
      <div class="bar"><span style="width:${all.size ? Math.round(seen / all.size * 100) : 0}%"></span></div>
      ${seen < all.size ? `<a class="btn ghost" href="#when/${esc(work)}/unseen">아직 안 본 조합 보기 →</a>` : `<p class="small muted">이번 시즌 주연 조합을 다 봤어요</p>`}</div>`;
  }).join("");

  <div><p class="eyebrow">내 관람 기록</p><h1>내 공연</h1></div>

  ${tab === "up" ? `<div class="cards2">${up.map(([x, i]) => card(x, i)).join("") || `<div class="card"><p class="small muted">볼 예정인 공연이 없어요.</p></div>`}</div>`
    : `${progress ? `<h2>내 캐스팅 아카이브</h2><div class="cards2">${progress}</div>` : ""}
  <div class="cards2">${done.map(([x, i]) => card(x, i)).join("") || `<div class="card"><p class="small muted">아직 본 공연이 없어요.</p></div>`}</div>`}`
  : `<div class="card"><p>아직 담은 공연이 없어요.</p><p class="small muted">회차 상세에서 '볼 예정에 담기'를 누르면 여기 모여요.</p><a class="btn" href="#works">추천 받으러 가기</a></div>`}`;
};

V.tag = i => {
  const x = S.plans[+i]; if (!x) return V.plans();
  setAccent(x.work);
  const ls = leads(x.work, x.cast);
  // 기분(mood) 한 번이면 저장된다. 배우는 '더 남기기'에서 고를 때만 들어간다(안 고르면 비움)
  const t = S.draft && S.draft.i === +i ? S.draft : (S.draft = {i: +i, mood: "", more: false, actor: "", role: "", tags: [], partner: "", combo: [], score: 0, seat: "", view: 0, note: ""});
  const others = ls.filter(([, a]) => a !== t.actor);
  if (t.actor && !others.some(([, a]) => a === t.partner)) t.partner = others[0]?.[1] || "";
  // 'PICKLE의 추천 이유가 실제와 맞았나요?': 이 회차 주연 배우들의 리뷰 태그를 하나씩 맞았어요/달랐어요/모르겠어요로. 고른 취향과 맞는 태그를 먼저, 없으면 배우마다 3개까지. 선택이라 안 눌러도 저장된다
  const wantT = wantSet(S.cal[x.work]?.axes || []), ck = t.check || {};
  const items = ls.flatMap(([, a]) => { const tg = reviewTags(D, x.work, a), mt = tg.filter(g => wantT.has(g)); return (mt.length ? mt : tg.slice(0, 3)).map(g => [a, g]); });

    <p class="tiny muted">'달랐어요'는 취향이 아니라 그 배우의 특성이 안 보였다는 뜻으로 읽어요.</p></div>` : "";
  return `
    <div><p class="eyebrow">관람 후 기록</p><h1>어땠어요?</h1></div>
    <p class="muted small">${esc(x.work)} · ${md(x.date)} ${esc(x.time)}</p>
    <div class="card"><h3>오늘 공연 어떠셨나요?</h3><div class="moods">${Object.entries(MOODS).map(([k, l]) => `<button class="mood ${t.mood === k ? "on" : ""}" data-act="tMood" data-m="${k}"><span class="em">${MOOD_UI[k][0]}</span><b>${l}</b><small>${MOOD_UI[k][1]}</small></button>`).join("")}</div></div>
    ${checkCard}
    <details id="more" class="tmore"${t.more ? "open" : ""} ontoggle="S.draft&&(S.draft.more=this.open)"><summary>더 남기기 (선택) — 남기면 다음 비교 카드가 더 정확해져요</summary><div>

    ${t.actor ? `<div class="card"><h3>${esc(t.actor)}의 어떤 점이 좋았어요? <span class="small muted">최대 3개</span></h3>
      ${(D.actorTagGroups || []).map(([g, tags]) => `<p class="tiny muted" style="margin:10px 0 4px">${esc(g.replace("배우 · ", ""))}</p><div class="chips">${tags.map(tag => `<button class="chip ${t.tags.includes(tag) ? "on" : ""}" data-act="tTag" data-t="${esc(tag)}" ${!t.tags.includes(tag) && t.tags.length >= 3 ? "disabled" : ""}>${esc(D.actorTagLabels[tag])}<small>${esc(tag)}</small></button>`).join("")}</div>`).join("")}</div>` : ""}
    ${(() => { const same = ((D.roles[x.work] || []).find(r => r.role === t.role)?.cast || []).filter(a => a !== t.actor), cmp = (t.cmp ||= {}); return same.length ? `<div class="card"><h3>같은 ${esc(t.role)} 역, 전에 본 배우와 비교하면? <span class="small muted">본 적 있는 배우만 · 선택</span></h3>
      ${same.map(b => `<div class="between" style="flex-wrap:wrap"><span>${esc(b)}</span><div class="chips">${[["skip", "안 봤어요"], ["a", `${t.actor} 쪽`], ["tie", "비슷"], ["b", `${b} 쪽`]].map(([v, l]) => `<button class="chip x ${(cmp[b] || "skip") === v ? "on" : ""}" data-act="tCmp" data-b="${esc(b)}" data-v="${v}">${esc(l)}</button>`).join("")}</div></div>`).join("")}

    ${t.actor && others.length ? `<div class="card"><h3>상대 배우와의 합은요? <span class="small muted">선택</span></h3>

      <div class="chips">${Object.entries(D.comboTagLabels).map(([tag, label]) => `<button class="chip ${t.combo.includes(tag) ? "on" : ""}" data-act="tCombo" data-t="${esc(tag)}">${esc(label)}<small>${esc(tag)}</small></button>`).join("")}</div></div>` : ""}

      <div class="score" style="margin-top:8px">${[1, 2, 3, 4, 5].map(n => `<button class="chip ${t.view === n ? "on" : ""}" data-act="tView" data-n="${n}">${n}</button>`).join("")}</div><p class="tiny muted">시야 · 1 많이 가렸다 · 5 아주 잘 보였다</p></div>

V.me = () => {
  const rows = exportRows();
  // 내 관람 기록으로 반영 중인 취향: 태그에 건 가중치만 보여 준다(배우 점수·순위는 없다). 기록이 없으면 카드를 숨기고, 꺼 둔 상태에서도 다시 켤 수 있게 카드는 남긴다
  const pw = personalWeights(S, D), pcnt = personalCounts(S), pup = Object.entries(pw).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]), pdn = Object.entries(pw).filter(([, v]) => v < 0).sort((a, b) => a[1] - b[1]);
  // 좋아하는 배우 설문(전부 선택): 쓴 글에서 태그 후보를 찾아 칩으로 보여 주고, 사용자가 누른 것만 저장한다. 입력 없는 배우는 접어 둔다
  const favs = S.prefs?.favs || [];
  const likeCard = !favs.length ? "" : `<div class="card"><h3>좋아하는 배우 더 알려주기 <span class="small muted">전부 선택</span></h3>
      <p class="small muted">쓴 글에서 태그 후보를 찾아 보여 줘요. 누른 것만 내 취향에 반영돼요.</p>
      ${likeBoxes(favs)}</div>`;
  const persCard = !(S.tags.length || S.votes.length || (S.likes || []).some(l => !likeEmpty(l))) ? "" : `<div class="card"><h3>내 관람 기록으로 반영 중인 취향</h3>
      ${S.noPersonal ? `<p class="small muted">기록 반영을 꺼 둔 상태예요. 추천은 고른 취향만 써요.</p>`
        : pup.length || pdn.length ? `${pup.length ? `<div><p class="tiny muted">더 맞았던 쪽</p><div class="chips">${pup.map(([tg, v]) => `<span class="tag hit">${esc(tg)} ${sgn(v)}</span>`).join("")}</div></div>` : ""}${pdn.length ? `<div><p class="tiny muted">덜 맞았던 쪽</p><div class="chips">${pdn.map(([tg, v]) => `<span class="tag">${esc(tg)} ${sgn(v)}</span>`).join("")}</div></div>` : ""}`
        : `<p class="small muted">아직 반영할 만큼 뚜렷한 기록이 없어요.</p>`}
      <p class="small muted">좋았던 회차 ${pcnt.good} · 아쉬웠던 회차 ${pcnt.bad}</p>
      <button class="btn ghost" data-act="toggleNoPersonal">${S.noPersonal ? "기록 반영 켜기" : "기록 반영 끄기"}</button></div>`;
  return `
    <h1>내 취향</h1>
    <div class="cards2">
    <div class="card">
      <div class="chips">${hasTaste(S.prefs) ? [...(S.prefs.works || []).map(id => cardOf(id)?.l), ...(S.prefs.axes || [])].filter(Boolean).map(a => `<span class="tag hit">${esc(a)}</span>`).join("") : `<span class="tag">아직 안 골랐어요</span>`}${(S.prefs?.favs || []).map(a => `<span class="tag">${esc(a)}</span>`).join("")}</div>
      <div class="chips"><span class="small muted">주로 보는 좌석 등급</span>${["VIP석", "R석", "S석", "A석"].map(g => `<button class="chip x ${S.prefs?.grade === g ? "on" : ""}" data-act="setGrade" data-g="${g}" aria-pressed="${S.prefs?.grade === g}">${g}</button>`).join("")}</div>
      <button class="btn ghost" data-go="#onboard/1">취향 다시 고르기</button></div>
    ${persCard}
    ${likeCard}
    <div class="card"><h3>내가 남긴 관람 기록 ${S.tags.length}건${S.votes.length ? ` <span class="small muted">· 비교 투표 ${S.votes.length}건</span>` : ""}</h3>
      ${S.tags.length ? S.tags.map(t => `<div class="actor"><div class="name"><span><b>${esc(t.work)}</b>${esc(t.actor)}</span><span class="small muted">${md(t.date)} ${esc(t.time)}${t.score ? ` · 추천 ${t.score}점` : ""}${t.seat ? ` · ${esc(t.seat)}` : ""}${t.view ? ` · 시야 ${t.view}` : ""}</span></div><div class="chips">${t.mood ? `<span class="tag hit">${esc(MOODS[t.mood] || "")}</span>` : ""}${t.tags.map(g => `<span class="tag hit">${esc(g)}</span>`).join("")}${t.combo.map(g => `<span class="tag">${esc(g)} · ${esc(t.partner)}</span>`).join("")}</div></div>`).join("")
        : `<p class="small muted">공연을 보고 기록을 남기면 여기 쌓여요. 태그까지 남기면 다음 추천에 바로 반영돼요.</p>`}</div>
    ${rows.length ? `<div class="card"><h3>팀 시트로 내보내기</h3><p class="small muted">'태그 기록' 탭 맨 아래에 붙여 넣는 TSV ${rows.length}줄이에요.</p><button class="btn ghost" data-act="copyTsv">TSV 복사</button><pre>${esc(rows.map(r => r.join("\t")).join("\n"))}</pre></div>` : ""}
    </div>
    <p class="tiny muted">이 가안은 이 브라우저에만 저장돼요. 추천 규칙과 데이터는 팀 시트와 recommend.py에서 와요.</p>`;
};

function exportRows() {
  const out = [];
  for (const t of S.tags) {
    const venue = runOf(t.work, t.date)?.venue || "", show = `${md(t.date)} ${t.time}`;
    // 좌석·시야는 태그 기록 탭에 열이 없어서 메모 열에 같이 적는다. 좌석 탭이 생기면 분리한다.
    const note = [t.note, t.seat ? `좌석 ${t.seat}` : "", t.view ? `시야 ${t.view}/5` : ""].filter(Boolean).join(" · ");
    // 기분만 남겨도 행 1개는 나간다: 종류 '관람', 태그 열에 기분. 배우·배역은 '더 남기기'에서 골랐을 때만 채워진다
    if (t.mood || !t.tags.length) out.push([t.at, "앱", t.work, "2026", venue, show, "관람", t.role, t.actor, "", MOODS[t.mood] || "", note, "직접 관람", ""]);
    for (const tag of t.tags) out.push([t.at, "앱", t.work, "2026", venue, show, "배우", t.role, t.actor, "", tag, note, "직접 관람", ""]);
    if (t.partner) for (const tag of t.combo) out.push([t.at, "앱", t.work, "2026", venue, show, "조합", t.role, t.actor, t.partner, tag, note, "직접 관람", ""]);
  }
  // 같은 배역 비교 투표: 종류 '비교', 배우=내가 본 쪽, 상대 배우=비교 대상, 태그 열에 결과
  for (const v of S.votes) out.push([v.at, "앱", v.work, "2026", runOf(v.work, v.date)?.venue || "", `${md(v.date)} ${v.time}`, "비교", v.role, v.a, v.b, v.result === "a" ? "더 좋았다" : v.result === "b" ? "덜 좋았다" : "비슷", "같은 배역 비교 투표", "직접 관람", ""]);
  return out;
}

// ---------- 라우터 ----------
let CUR = {name: "", args: []}, lastHash, RES;  // RES: 결과 화면의 고른 조합 요약(폰의 하단 버튼용)
function route() {
  const h = decodeURIComponent(location.hash.slice(1) || "works");  // 첫 화면은 작품 홈. 취향이 없는 첫 방문만 시작할 때 #onboard/1 로 보낸다
  const [name, ...args] = h.split("/");
  CUR = {name, args};
  closeSheet();
  RES = null;
  const view = $("#view"); view.innerHTML = (V[name] || V.works)(...args); view.dataset.view = V[name] ? name : "works";
  const stepIdx = {works: 0, show: 0, cshow: 0, pick: 1, result: 1, when: 2, cal: 2, detail: 3, saved: 3, tag: 4}[name];
  $("#steps").innerHTML = stepIdx === undefined ? "" : STEP_NAMES.map((s, i) => `<span class="${i === stepIdx ? "on" : ""}"><i>0${i + 1}</i>${s}</span>`).join('<b class="sep">→</b>');
  $("#back").hidden = ["works", "onboard", "plans", "me"].includes(name);
  const tab = {plans: "plans", tag: "plans", me: "me"}[name] || "home";
  document.querySelectorAll("[data-tab]").forEach(a => a.classList.toggle("on", a.dataset.tab === tab));
  const cta = $("#cta");
  if (name === "cal") { const st = S.cal[args[0]], nd = (st?.dates || []).length; cta.hidden = false;
    cta.innerHTML = nd ? `<button class="btn" data-act="runQuery" data-work="${esc(args[0])}" ${st.count ? "" : "disabled"}>${nd}일 골랐어요 → 그날 회차 비교 (회차 ${st.count}개)</button>` : `<button class="btn" data-act="runAll" data-work="${esc(args[0])}" ${st?.count ? "" : "disabled"}>목록으로 보기 →</button>`; }
  else if (name === "result" && RES?.go) { cta.hidden = false; cta.innerHTML = `<button class="btn" data-go="${esc(RES.go)}" ${RES.n ? "" : "disabled"}>${RES.n ? `조건에 맞는 회차 ${RES.n}개 보기 →` : "같이 나오는 날이 없어요"}</button>`; }
  else if (name === "pick" && RES?.go) { cta.hidden = false; cta.innerHTML = `<button class="btn" data-go="${esc(RES.go)}" ${RES.n ? "" : "disabled"}>${RES.n ? `조건에 맞는 회차 ${RES.n}개 보기 →` : "같이 나오는 날이 없어요"}</button>`; }
  else if (name === "result" && RES) { cta.hidden = false; cta.innerHTML = `<button class="btn" data-act="toSide">${RES.n ? `${RES.sel ? "고른 조합" : "전체"} 회차 ${RES.n}개 보기 ↓` : "같이 나오는 날이 없어요 ↓"}</button>`; }
  else cta.hidden = true;
  if (location.hash !== lastHash) window.scrollTo(0, 0);  // 화면이 바뀔 때만 맨 위로. 카드·칩을 눌러 다시 그릴 땐 스크롤을 유지한다
  lastHash = location.hash;
}
window.addEventListener("hashchange", route);
$("#back").addEventListener("click", () => history.back());
$("#sheetbg").addEventListener("click", closeSheet);

// ---------- 동작 ----------
document.addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if (go) {
    if (go.dataset.entry) { const en = ((S.stats ||= {}).entry ||= {rec: 0, browse: 0}); en[go.dataset.entry] = (en[go.dataset.entry] || 0) + 1; save(); }  // 홈에서 어느 입구(추천 칸/모든 작품)로 들어왔는지. 나중에 보려고 세기만 하고 화면엔 안 보인다
    location.hash = go.dataset.go; return; }
  if (e.target.closest("a[href]")) return;  // 카드 안의 출처·영상 링크는 카드 동작을 건드리지 않는다
  const act = e.target.closest("[data-act]"); if (!act) return;
  const d = act.dataset, draft = S.draft, work = CUR.args[0];
  switch (d.act) {
    case "obCard": { const P = prefsOf(), next = toggleCard(P.works, d.id); if (!next) { toast(`${isMusic(d.id) ? MUSIC_MAX : TASTE_MAX}개까지 고를 수 있어요`); return; } P.works = next; save(); route(); break; }
    case "obAxis": { const P = prefsOf(), next = toggleAxis(P.axes, d.v, d.l, d.r);
      for (const st of Object.values(S.cal)) followBase(st, P.axes);  // 바꾸기 전 기본 취향으로 먼저 '직접 바꿨나'를 가려 두고
      P.axes = next; for (const st of Object.values(S.cal)) followBase(st, next);  // 안 바꾼 작품은 새 기본 취향을 따라가게 저장 값도 맞춘다
      save(); route(); break; }
    case "obGo": { prefsOf(); save(); if (+d.to > 3) { location.hash = "#works"; if (hasTaste(S.prefs)) toast("취향을 저장했어요"); } else location.hash = "#onboard/" + d.to; break; }  // 건너뛰어도 S.prefs 는 만들어 둔다(다시 자동으로 안 뜨게)
    case "addFav": { const v = $("#fav").value.trim(), P = prefsOf(); if (!v) return; if (!P.favs.includes(v)) { P.favs.push(v); likeOpen.add(v); if (!knownActor(D, v)) noteRequest(v); } save(); route(); $("#fav")?.focus(); break; }
    case "likeAsk": likeOpen.add(d.a); location.hash = "#me"; setTimeout(() => [...document.querySelectorAll(".likebox")].find(x => x.dataset.a === d.a)?.scrollIntoView(), 60); break;  // 홈의 '어떤 점이 좋아요?' → 내 취향의 그 배우 입력 칸을 열어 둔다
    case "rmFav": { const P = prefsOf(); P.favs = P.favs.filter(a => a !== d.a); save(); route(); break; }
    case "setGrade": { const P = prefsOf(); P.grade = P.grade === d.g ? "" : d.g; save(); route(); break; }
    case "toggleActor": { const st = (S.cal[d.work || work] ||= {actors: [], period: "all"}); st.actors = st.actors.includes(d.a) ? st.actors.filter(a => a !== d.a) : [...st.actors, d.a]; save(); route(); break; }
    case "clearActors": S.cal[d.work || work].actors = []; save(); route(); break;
    case "toggleAvoid": {  // 제외는 보고 싶은 배우와 동시에 될 수 없다. 다시 누르면 풀림
      const st = (S.cal[d.work || work] ||= {actors: [], period: "all"}), av = st.avoid || [];
      st.avoid = av.includes(d.a) ? av.filter(a => a !== d.a) : [...av, d.a]; st.actors = st.actors.filter(a => a !== d.a);
      save(); route(); break; }
    case "period": S.cal[work].period = d.p; save(); route(); break;
    case "rAxis": {  // 작품별 취향 칩. 짝(노래↔연기 등)은 하나만
      const st = S.cal[d.work], P = Object.fromEntries(D.axes.flatMap(a => [[a.left, a.right], [a.right, a.left]]));  // 짝은 사전·설문 축 5쌍에서
      st.axes = !d.v ? [] : st.axes.includes(d.v) ? st.axes.filter(x => x !== d.v) : [...st.axes.filter(x => x !== P[d.v]), d.v];
      st.edited = true; save(); route(); break; }  // 이 작품에서 직접 바꿨다: 이제 기본 취향이 바뀌어도 따라가지 않는다
    case "rAxisReset": S.cal[d.work].edited = false; followBase(S.cal[d.work], S.prefs?.axes || []); save(); route(); break;  // 기본 취향을 다시 따른다
    case "run": S.cal[work].run = d.r; save(); route(); break;
    case "dropActor": { const w = d.work || work; S.cal[w].actors = S.cal[w].actors.filter(a => a !== d.a); save(); route(); break; }
    case "peek": { (S.cal[d.work || work] ||= {actors: [], period: "all"}).peek = d.d; save(); route(); break; }
    case "pinDate": { const st = (S.cal[d.work || work] ||= {actors: [], period: "all"}); st.dates = (st.dates || []).includes(d.d) ? st.dates.filter(x => x !== d.d) : [...(st.dates || []), d.d].sort(); st.peek = d.d; if (S.query?.work === (d.work || work)) S.query.dates = st.dates; save(); route(); break; }
    case "runAll": { const st = S.cal[d.work]; st.dates = []; save(); location.hash = "#when/" + d.work; break; }  // 달력에서 날짜를 안 고르면 '언제' 목록으로
    case "whenF": { const st = S.cal[d.work], f = (st.f ||= {}); f[d.k] = !f[d.k]; if (d.k === "day" && f.day) f.eve = false; if (d.k === "eve" && f.eve) f.day = false; save(); route(); break; }
    case "whenClear": S.cal[d.work].f = {}; save(); route(); break;
    case "unpinDate": { const st = S.cal[d.work || work]; st.dates = (st.dates || []).filter(x => x !== d.d); if (S.query?.work === (d.work || work)) S.query.dates = st.dates; save(); route(); break; }
    case "clearDates": { const st = S.cal[d.work || work]; st.dates = []; if (S.query?.work === (d.work || work)) S.query.dates = []; save(); route(); break; }
    case "toSide": $("#view .side").scrollIntoView(); break;
    case "closeSheet": closeSheet(); break;
    case "runQuery": { const st = S.cal[d.work]; if (!st?.count) { toast("조건에 맞는 회차가 없어요"); return; } S.query = {work: d.work, lo: st.lo, hi: st.hi, actors: st.actors, dates: st.dates || []}; save(); location.hash = "#result"; break; }
    case "plan": { const p = D.perfs.find(x => x.work === d.work && x.date === d.date && x.time === d.time); if (isPrivate(p)) { toast("전체대관 회차는 일반 예매가 안 돼요"); return; } S.plans.push({work: p.work, date: p.date, dow: p.dow, time: p.time, cast: p.cast, tagged: false}); save(); location.hash = "#saved/" + (S.plans.length - 1); break; }
    case "unplan": S.plans.splice(+d.i, 1); save(); route(); break;
    case "plansTab": S.plansTab = d.t; save(); route(); break;
    case "tQuick": { const x = S.plans[+d.i]; x.quick = x.quick === d.q ? "" : d.q; save(); route(); break; }  // 저장 확인 화면의 좋아요/아쉬워요. 다시 누르면 해제
    case "toggleNoPersonal": S.noPersonal = !S.noPersonal; save(); route(); break;  // 내 취향 화면의 '기록 반영 끄기/켜기'
    case "likeTag": { const l = likeGet(d.a), arr = +d.ri < 0 ? l.tags : l.roles[+d.ri].tags; const k = arr.indexOf(d.t); if (k < 0) arr.push(d.t); else arr.splice(k, 1); likeOpen.add(d.a); save(); route(); break; }  // 후보 칩: 누른 것만 저장, 다시 누르면 해제
    case "likeRoleAdd": likeGet(d.a).roles.push({work: "", role: "", why: "", tags: []}); likeOpen.add(d.a); save(); route(); break;
    case "likeRoleDel": likeGet(d.a).roles.splice(+d.ri, 1); likeOpen.add(d.a); save(); route(); break;
    case "tMood": draft.mood = draft.mood === d.m ? "" : d.m; route(); break;
    case "tCheck": { const c = (draft.check ||= {}); if (c[d.k] === d.v) delete c[d.k]; else c[d.k] = d.v; route(); break; }  // 추천 이유 확인. 다시 누르면 해제(안 누른 상태 = 답 없음)
    case "tActor": { const off = draft.actor === d.a; draft.actor = off ? "" : d.a; draft.role = off ? "" : d.r; draft.tags = []; draft.cmp = {}; draft.combo = []; route(); break; }  // 다시 누르면 해제(안 고른 상태로)
    case "tCmp": (draft.cmp ||= {})[d.b] = d.v; route(); break;
    case "tTag": draft.tags = draft.tags.includes(d.t) ? draft.tags.filter(x => x !== d.t) : [...draft.tags, d.t].slice(0, 3); route(); break;
    case "tPartner": draft.partner = d.a; route(); break;
    case "tCombo": draft.combo = draft.combo.includes(d.t) ? draft.combo.filter(x => x !== d.t) : [...draft.combo, d.t]; route(); break;
    case "tScore": draft.score = +d.n; route(); break;
    case "tView": draft.view = +d.n; route(); break;
    case "tSave": { const x = S.plans[draft.i];
      S.tags.push({at: today(), work: x.work, date: x.date, time: x.time, mood: draft.mood || "", role: draft.role, actor: draft.actor, tags: draft.tags, partner: draft.combo.length ? draft.partner : "", combo: draft.combo, score: draft.score, seat: $("#seat").value.trim(), view: draft.view || 0, note: $("#note").value.trim(), check: {...(draft.check || {})}});
      for (const [b, v] of Object.entries(draft.cmp || {})) if (v !== "skip") S.votes.push({at: today(), work: x.work, date: x.date, time: x.time, role: draft.role, a: draft.actor, b, result: v});
      x.tagged = true; S.draft = null; save(); mergeMyTags(); location.hash = "#me"; toast(draft.tags.length ? "저장했어요. 다음 추천에 반영돼요" : "저장했어요"); break; }
    case "copyTsv": { const text = exportRows().map(r => r.join("\t")).join("\n");
      (navigator.clipboard?.writeText(text) || Promise.reject()).then(() => toast("복사했어요"), () => { const r = document.createRange(); r.selectNodeContents($("pre")); getSelection().removeAllRanges(); getSelection().addRange(r); toast("드래그된 글을 복사하세요"); }); break; }
  }
});
document.addEventListener("input", e => { if (S.draft && (e.target.id === "note" || e.target.id === "seat")) S.draft[e.target.id] = e.target.value; });
// 좋아하는 배우 설문: 글을 쓰는 동안 저장하고, 그 칸의 태그 후보 칩만 다시 그린다(화면 전체를 다시 그리지 않아 커서가 안 튄다)
document.addEventListener("input", e => {
  const el = e.target.closest("[data-like]"); if (!el) return;
  const l = likeGet(el.dataset.a), ri = el.dataset.ri === undefined ? -1 : +el.dataset.ri, kind = el.dataset.like, r = ri >= 0 ? l.roles[ri] : null;
  if (kind === "why") l.why = el.value; else if (r) r[kind === "rwhy" ? "why" : kind] = el.value;
  likeOpen.add(el.dataset.a); save();
  const box = el.closest(".likebox").querySelector(`[data-sg="${ri}"]`);
  if (box && (kind === "why" || kind === "rwhy")) box.innerHTML = lkChips(kind === "why" ? l.why : r.why, kind === "why" ? l.tags : r.tags, el.dataset.a, ri);
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "fav") { e.preventDefault(); $("[data-act=addFav]").click(); } });
if (!S.prefs && !location.hash) history.replaceState(null, "", "#onboard/1");  // 처음 온 사람(취향 없음)의 첫 화면은 3단계 취향. #pick/… 같은 주소로 바로 들어온 사람은 그대로 둔다
route();
</script>
